# IaC scan settings (checkov). The pipeline fails on any finding that is not
# listed here or skipped inline (Metadata: checkov: skip) next to the resource.
# Every skip is a design decision from the brief, written down so it can be
# challenged in review.
framework:
  - cloudformation
compact: true
quiet: true
skip-download: true
skip-check:
  # Brief: "No customer-managed KMS keys; AWS-managed keys only".
  - CKV_AWS_119   # DynamoDB with a customer-managed key (tables use AWS-owned encryption)
  - CKV_AWS_158   # Log groups with a customer-managed key (logs are encrypted by CloudWatch)
  - CKV_AWS_173   # Lambda environment variables with a customer-managed key (they hold names, never secrets)
  # Brief: "Multi-region or multi-AZ deployment" is out of scope; single-AZ RDS.
  - CKV_AWS_157
  # Cost and Free Tier: enhanced monitoring, API caching and S3 access logs are paid extras.
  - CKV_AWS_118   # RDS enhanced monitoring (CloudWatch basic RDS metrics are used)
  - CKV_AWS_120   # API Gateway caching (responses are per user and must never be cached)
  - CKV_AWS_18    # S3 server access logs (CloudTrail data events can be enabled instead)
  # X-Ray is not part of the MediSlot architecture. Requests are followed
  # through the correlation ID and API Gateway request ID in the JSON logs.
  - CKV_AWS_73    # API Gateway stage X-Ray tracing
  # Database credentials come from an SSM SecureString; IAM DB auth is not used.
  - CKV_AWS_161
  # API Lambdas are invoked synchronously (a DLQ only applies to async calls).
  # The scheduled materialiser uses the scheduler's retry policy and is idempotent.
  - CKV_AWS_116
  # New accounts have an account concurrency of 10; reserving concurrency per
  # function would exhaust it. Throttling is applied at API Gateway instead.
  - CKV_AWS_115
