<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · MediSlot operations</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <h1><span class="brand-name">MediSlot</span> operations <span class="env-badge">{{ environment }}</span></h1>
    <p class="muted">Sign in to view the {{ environment }} environment.</p>

    {% if error %}
    <p class="form-error" role="alert"><span aria-hidden="true">✕</span> {{ error }}</p>
    {% endif %}

    {% if configured %}
    <form method="post" action="{{ url_for('login') }}" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="200" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
