{% extends "base.html" %}
{% block title %}{{ role|title }} login · MediSlot{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ role|title }} login</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit" class="button primary">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.' ~ role ~ '_register') }}">Create a {{ role }} account</a></p>
  <p class="muted"><a href="{{ url_for('auth.landing') }}">Back</a></p>
</section>
{% endblock %}
