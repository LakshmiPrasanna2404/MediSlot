AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot authentication: the Auth Lambda (register, login, refresh, logout)
  and the JWT Lambda authorizer, plus the authentication settings in SSM.
  The JWT signing secret itself is a SecureString seeded once
  (scripts/seed_secrets.sh) and read by both functions at cold start.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - prod

  AuthCodeS3Bucket:
    Type: String
    Description: Artifacts bucket holding the Lambda packages

  AuthCodeS3Key:
    Type: String
    Description: S3 key of the Auth Lambda package

  AuthorizerCodeS3Bucket:
    Type: String
    Description: Artifacts bucket holding the Lambda packages

  AuthorizerCodeS3Key:
    Type: String
    Description: S3 key of the authorizer Lambda package

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: CloudWatch log retention period

  AuthMemorySize:
    Type: Number
    Default: 1024
    MinValue: 128
    MaxValue: 10240
    Description: >-
      Auth Lambda memory in MB. bcrypt at work factor 12 is CPU-bound and Lambda
      CPU scales with memory, so this keeps login under a second.

Resources:
  # ---------------------------------------------------------------------------
  # Authentication settings (frozen rule set). All SSM-configurable.
  # ---------------------------------------------------------------------------
  AuthAccessTokenSeconds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/auth/access-token-seconds
      Type: String
      Value: '900'
      Description: Access token lifetime in seconds (15 minutes)
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  AuthRefreshTokenSeconds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/auth/refresh-token-seconds
      Type: String
      Value: '604800'
      Description: Refresh token lifetime in seconds (7 days)
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  AuthBcryptRounds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/auth/bcrypt-rounds
      Type: String
      Value: '12'
      Description: bcrypt work factor (12 or higher; the Auth Lambda refuses lower)
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  AuthPasswordMinLength:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/auth/password-min-length
      Type: String
      Value: '10'
      Description: Minimum password length (policy also needs one letter and one digit)
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  AuthJwtIssuer:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/auth/jwt-issuer
      Type: String
      Value: !Sub medislot-${Environment}
      Description: Issuer the authorizer checks on every token
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # Functions
  # ---------------------------------------------------------------------------
  AuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-auth
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-authorizer
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AuthFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthFunctionLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-auth
      Description: Register doctors and patients, log in, refresh and log out
      Runtime: python3.12
      Handler: auth_handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-auth-role-arn
      Timeout: 15
      MemorySize: !Ref AuthMemorySize
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref AuthCodeS3Bucket
        S3Key: !Ref AuthCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          JWT_SECRET_PARAMETER: !Sub /medislot/${Environment}/auth/jwt-secret
          REFRESH_TOKENS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-refresh-tokens-table-name
          TOKEN_REVOCATIONS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-token-revocations-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthorizerFunctionLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-authorizer
      Description: Verify JWT signature, issuer and expiry, check the denylist and the route role
      Runtime: python3.12
      Handler: authorizer_handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-authorizer-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref AuthorizerCodeS3Bucket
        S3Key: !Ref AuthorizerCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          JWT_SECRET_PARAMETER: !Sub /medislot/${Environment}/auth/jwt-secret
          TOKEN_REVOCATIONS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-token-revocations-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

Outputs:
  AuthFunctionName:
    Value: !Ref AuthFunction
    Export:
      Name: !Sub medislot-${Environment}-auth-function-name

  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-auth-function-arn

  AuthorizerFunctionName:
    Value: !Ref AuthorizerFunction
    Export:
      Name: !Sub medislot-${Environment}-authorizer-function-name

  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-authorizer-function-arn
