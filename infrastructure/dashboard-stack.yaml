AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot web application: one EC2 instance in the public subnet running one
  Flask app that serves both the doctor dashboard (/doctor/*) and the patient
  dashboard (/patient/*). It is a pure API client: no database credentials, no
  route to RDS, every read and write goes through API Gateway. The app is pulled
  from S3 on every boot, so the instance is disposable; a new package key
  restarts it with the new code.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment.
    AllowedValues:
      - dev
      - prod

  DashboardCodeS3Bucket:
    Type: String
    Description: Artifacts bucket holding the web app package.

  DashboardCodeS3Key:
    Type: String
    Description: S3 key of the web app package zip.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    Description: >-
      EC2 instance type. The architecture shows t2.micro; t3.micro is the
      default because AWS Free plan accounts cannot launch t2.micro, and it is
      the type the existing instance already runs on.

  ApiBaseUrl:
    Type: String
    AllowedPattern: '^https://.+'
    Description: >-
      HTTP API base URL (the ApiUrl output of the medislot-<env>-api stack). The
      pipeline reads it from that stack and passes it in.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI (public SSM parameter).

Resources:
  DashboardInstance:
    Type: AWS::EC2::Instance
    DependsOn: WebLogGroup
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !ImportValue
        Fn::Sub: medislot-${Environment}-public-subnet-id
      # The network stack's EC2 group: HTTP 80 from anywhere, HTTPS out, no SSH.
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: medislot-${Environment}-ec2-sg-id
      IamInstanceProfile: !ImportValue
        Fn::Sub: medislot-${Environment}-dashboard-profile-name
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-web
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
      # cloud-init runs the script on EVERY boot (scripts-user: always). A new
      # package key changes this text, CloudFormation stops and starts the
      # instance, and the script installs the new package on the way up.
      UserData:
        Fn::Base64: !Sub |
          Content-Type: multipart/mixed; boundary="==MEDISLOT=="
          MIME-Version: 1.0

          --==MEDISLOT==
          Content-Type: text/cloud-config; charset="us-ascii"

          #cloud-config
          cloud_final_modules:
            - [scripts-user, always]

          --==MEDISLOT==
          Content-Type: text/x-shellscript; charset="us-ascii"

          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/medislot-web-bootstrap.log /dev/console) 2>&1
          echo "medislot web bootstrap start: $(date -u +%FT%TZ)"

          dnf install -y python3.12 python3.12-pip unzip
          # Log shipping is useful but not essential: if it cannot be installed
          # the web app still starts.
          dnf install -y amazon-cloudwatch-agent logrotate || echo "warning: CloudWatch agent not installed"

          id medislot >/dev/null 2>&1 || useradd --system --home-dir /opt/medislot --shell /sbin/nologin medislot
          install -d -o medislot -g medislot /opt/medislot /var/lib/medislot /var/lib/medislot/sessions
          install -d -m 0755 -o medislot -g medislot /var/log/medislot

          # Ship the app log and this boot log to CloudWatch Logs
          # (/medislot/<env>/web, one stream per instance and file).
          cat > /etc/logrotate.d/medislot-web <<'ROTATEEOF'
          /var/log/medislot/web.log {
              daily
              rotate 7
              compress
              missingok
              notifempty
              copytruncate
          }
          ROTATEEOF
          if [ -x /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl ]; then
            cat > /opt/aws/amazon-cloudwatch-agent/etc/medislot-agent.json <<'AGENTEOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {"file_path": "/var/log/medislot/web.log", "log_group_name": "/medislot/${Environment}/web",
                     "log_stream_name": "{instance_id}/web", "timezone": "UTC"},
                    {"file_path": "/var/log/medislot-web-bootstrap.log", "log_group_name": "/medislot/${Environment}/web",
                     "log_stream_name": "{instance_id}/bootstrap", "timezone": "UTC"}
                  ]
                }
              }
            }
          }
          AGENTEOF
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/medislot-agent.json || echo "warning: CloudWatch agent did not start"
          fi

          # Session signing key: random, generated on the first boot and kept on
          # the instance's disk, readable only by the app. Never in SSM or in git.
          install -d -m 0750 -o root -g medislot /etc/medislot
          if [ ! -s /etc/medislot/session-secret ]; then
            (umask 077; python3 -c 'import secrets; print(secrets.token_hex(32))' > /etc/medislot/session-secret)
          fi
          chown medislot:medislot /etc/medislot/session-secret
          chmod 600 /etc/medislot/session-secret

          # No secrets here: the API address and the path of the key file.
          cat > /etc/medislot-web.env <<'ENVEOF'
          ENVIRONMENT=${Environment}
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          MEDISLOT_API_BASE_URL=${ApiBaseUrl}
          MEDISLOT_SESSION_SECRET_FILE=/etc/medislot/session-secret
          MEDISLOT_SESSION_DIR=/var/lib/medislot/sessions
          ENVEOF
          chmod 644 /etc/medislot-web.env

          WORK=$(mktemp -d)
          aws s3 cp "s3://${DashboardCodeS3Bucket}/${DashboardCodeS3Key}" "$WORK/web.zip" --region ${AWS::Region}
          rm -rf /opt/medislot/app.new
          mkdir /opt/medislot/app.new
          unzip -q "$WORK/web.zip" -d /opt/medislot/app.new
          test -f /opt/medislot/app.new/dashboard/wsgi.py

          test -d /opt/medislot/venv || python3.12 -m venv /opt/medislot/venv
          /opt/medislot/venv/bin/pip install --quiet --disable-pip-version-check -r /opt/medislot/app.new/dashboard/requirements.txt

          rm -rf /opt/medislot/app
          mv /opt/medislot/app.new /opt/medislot/app
          chown -R medislot:medislot /opt/medislot /var/lib/medislot

          cat > /etc/systemd/system/medislot-web.service <<'UNITEOF'
          [Unit]
          Description=MediSlot web app (doctor and patient dashboards)
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=medislot
          Group=medislot
          WorkingDirectory=/opt/medislot/app
          EnvironmentFile=/etc/medislot-web.env
          # Flask's built-in server (threaded). The app writes one JSON line per
          # request and event; the CloudWatch agent ships this file.
          ExecStart=/opt/medislot/venv/bin/flask --app dashboard.wsgi:app run --host 0.0.0.0 --port 80 --with-threads --no-reload --no-debugger
          StandardOutput=append:/var/log/medislot/web.log
          StandardError=append:/var/log/medislot/web.log
          Restart=always
          RestartSec=5
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          UNITEOF

          # The earlier ops dashboard service used the same port; stop it first.
          systemctl disable --now medislot-dashboard 2>/dev/null || true
          rm -f /etc/systemd/system/medislot-dashboard.service
          systemctl daemon-reload
          systemctl enable medislot-web
          systemctl restart medislot-web
          echo "medislot web bootstrap done: $(date -u +%FT%TZ)"

          --==MEDISLOT==--

  # The web app's logs (app requests and events, and the boot script), shipped
  # by the CloudWatch agent on the instance.
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /medislot/${Environment}/web
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # Stable public address; the instance can be replaced without changing it.
  DashboardElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-web-ip
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DashboardElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DashboardElasticIp.AllocationId
      InstanceId: !Ref DashboardInstance

Outputs:
  WebLogGroupName:
    Description: CloudWatch log group of the web app.
    Value: !Ref WebLogGroup

  DashboardUrl:
    Description: Web app address (landing page with Login as Doctor / Login as Patient).
    Value: !Sub http://${DashboardElasticIp}
    Export:
      Name: !Sub medislot-${Environment}-dashboard-url

  DashboardInstanceId:
    Description: Web app EC2 instance id.
    Value: !Ref DashboardInstance
    Export:
      Name: !Sub medislot-${Environment}-dashboard-instance-id
