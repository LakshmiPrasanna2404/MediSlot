AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot configuration. Every threshold, window, percentage and duration from
  the frozen rule set lives here as an SSM parameter under
  /medislot/{env}/config/, never in code. Lambdas read the whole path once per
  container. Authentication settings live in the auth stack (/medislot/{env}/auth/).
  Secrets (JWT signing key, DB password, web session key) are SecureStrings
  seeded once with scripts/seed_secrets.sh; CloudFormation cannot create them.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.

  DefaultDoctorTimezone:
    Type: String
    Default: Asia/Kolkata
    Description: IANA time zone given to a doctor who does not choose one at registration.

# The parameters are created one after another (DependsOn chain): SSM throttles
# PutParameter, and creating them all in parallel can fail with "Rate exceeded".
Resources:
  # --- Slots (Milestone 3) ---------------------------------------------------
  BookingWindowDays:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/config/slots/booking-window-days
      Type: String
      Value: '30'
      Description: Rolling window of materialised slots, in days.
  MaxLookupDays:
    Type: AWS::SSM::Parameter
    DependsOn: BookingWindowDays
    Properties:
      Name: !Sub /medislot/${Environment}/config/slots/max-lookup-days
      Type: String
      Value: '31'
      Description: Longest date range one slot lookup may ask for.
  DoctorDefaultTimezone:
    Type: AWS::SSM::Parameter
    DependsOn: MaxLookupDays
    Properties:
      Name: !Sub /medislot/${Environment}/config/doctors/default-timezone
      Type: String
      Value: !Ref DefaultDoctorTimezone
      Description: Time zone for a doctor who registers without one.

  # --- Photos and search (Milestones 3 and 4) -------------------------------
  PhotoMaxUploadBytes:
    Type: AWS::SSM::Parameter
    DependsOn: DoctorDefaultTimezone
    Properties:
      Name: !Sub /medislot/${Environment}/config/photos/max-upload-bytes
      Type: String
      Value: '5242880'
      Description: Largest profile photo accepted by the pre-signed POST (5 MiB).
  PhotoUploadUrlSeconds:
    Type: AWS::SSM::Parameter
    DependsOn: PhotoMaxUploadBytes
    Properties:
      Name: !Sub /medislot/${Environment}/config/photos/upload-url-seconds
      Type: String
      Value: '300'
      Description: Lifetime of a photo upload URL.
  PhotoViewUrlSeconds:
    Type: AWS::SSM::Parameter
    DependsOn: PhotoUploadUrlSeconds
    Properties:
      Name: !Sub /medislot/${Environment}/config/photos/view-url-seconds
      Type: String
      Value: '900'
      Description: Lifetime of a photo download URL.
  SearchDefaultPageSize:
    Type: AWS::SSM::Parameter
    DependsOn: PhotoViewUrlSeconds
    Properties:
      Name: !Sub /medislot/${Environment}/config/search/default-page-size
      Type: String
      Value: '20'
      Description: Doctor search page size when none is given.
  SearchMaxPageSize:
    Type: AWS::SSM::Parameter
    DependsOn: SearchDefaultPageSize
    Properties:
      Name: !Sub /medislot/${Environment}/config/search/max-page-size
      Type: String
      Value: '50'
      Description: Largest doctor search page size.

  # --- Booking and idempotency (Milestone 5) --------------------------------
  MaxUpcomingPerDoctor:
    Type: AWS::SSM::Parameter
    DependsOn: SearchMaxPageSize
    Properties:
      Name: !Sub /medislot/${Environment}/config/booking/max-upcoming-per-doctor
      Type: String
      Value: '3'
      Description: Most upcoming appointments a patient may hold with one doctor.
  BookingMaxConflictRetries:
    Type: AWS::SSM::Parameter
    DependsOn: MaxUpcomingPerDoctor
    Properties:
      Name: !Sub /medislot/${Environment}/config/booking/max-conflict-retries
      Type: String
      Value: '5'
      Description: Bounded retries on a version conflict when booking.
  BookingBackoffBaseMs:
    Type: AWS::SSM::Parameter
    DependsOn: BookingMaxConflictRetries
    Properties:
      Name: !Sub /medislot/${Environment}/config/booking/backoff-base-ms
      Type: String
      Value: '20'
      Description: Base of the exponential backoff (with jitter) between booking retries.
  IdempotencyTtlHours:
    Type: AWS::SSM::Parameter
    DependsOn: BookingBackoffBaseMs
    Properties:
      Name: !Sub /medislot/${Environment}/config/idempotency/ttl-hours
      Type: String
      Value: '24'
      Description: How long an Idempotency-Key and its stored response are kept.

  # --- Refunds (Milestone 5) -------------------------------------------------
  RefundFullMinHours:
    Type: AWS::SSM::Parameter
    DependsOn: IdempotencyTtlHours
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/full-refund-min-hours
      Type: String
      Value: '48'
      Description: Cancelling more than this many hours ahead refunds 100 percent.
  RefundPartialHighMinHours:
    Type: AWS::SSM::Parameter
    DependsOn: RefundFullMinHours
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/partial-high-min-hours
      Type: String
      Value: '24'
      Description: Lower bound (hours ahead) of the 75 percent tier.
  RefundPartialHighPercent:
    Type: AWS::SSM::Parameter
    DependsOn: RefundPartialHighMinHours
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/partial-high-percent
      Type: String
      Value: '75'
      Description: Refund percent between 24 and 48 hours ahead.
  RefundPartialLowMinHours:
    Type: AWS::SSM::Parameter
    DependsOn: RefundPartialHighPercent
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/partial-low-min-hours
      Type: String
      Value: '6'
      Description: Lower bound (hours ahead) of the 50 percent tier.
  RefundPartialLowPercent:
    Type: AWS::SSM::Parameter
    DependsOn: RefundPartialLowMinHours
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/partial-low-percent
      Type: String
      Value: '50'
      Description: Refund percent between 6 and 24 hours ahead.
  RefundLatePercent:
    Type: AWS::SSM::Parameter
    DependsOn: RefundPartialLowPercent
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/late-percent
      Type: String
      Value: '0'
      Description: Refund percent less than 6 hours ahead.
  RefundDoctorCancelPercent:
    Type: AWS::SSM::Parameter
    DependsOn: RefundLatePercent
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/doctor-cancel-percent
      Type: String
      Value: '100'
      Description: Refund percent when the doctor cancels, regardless of timing.
  RefundNoShowPercent:
    Type: AWS::SSM::Parameter
    DependsOn: RefundDoctorCancelPercent
    Properties:
      Name: !Sub /medislot/${Environment}/config/refund/no-show-percent
      Type: String
      Value: '0'
      Description: Refund percent for an appointment marked NO_SHOW.

  # --- Reschedule, waitlist, notifications (Milestone 6) --------------------
  RescheduleMaxCount:
    Type: AWS::SSM::Parameter
    DependsOn: RefundNoShowPercent
    Properties:
      Name: !Sub /medislot/${Environment}/config/reschedule/max-count
      Type: String
      Value: '2'
      Description: Most times one appointment may be rescheduled.
  RescheduleCutoffHours:
    Type: AWS::SSM::Parameter
    DependsOn: RescheduleMaxCount
    Properties:
      Name: !Sub /medislot/${Environment}/config/reschedule/cutoff-hours
      Type: String
      Value: '6'
      Description: No rescheduling within this many hours of the start.
  WaitlistHoldMinutes:
    Type: AWS::SSM::Parameter
    DependsOn: RescheduleCutoffHours
    Properties:
      Name: !Sub /medislot/${Environment}/config/waitlist/hold-minutes
      Type: String
      Value: '15'
      Description: How long a hold offer reserves the freed seat.
  WaitlistMaxPerPatient:
    Type: AWS::SSM::Parameter
    DependsOn: WaitlistHoldMinutes
    Properties:
      Name: !Sub /medislot/${Environment}/config/waitlist/max-active-per-patient
      Type: String
      Value: '5'
      Description: Most waitlists one patient may be on at once.
  ReminderOffsetsHours:
    Type: AWS::SSM::Parameter
    DependsOn: WaitlistMaxPerPatient
    Properties:
      Name: !Sub /medislot/${Environment}/config/notifications/reminder-offsets-hours
      Type: String
      Value: '24,2'
      Description: Reminders are sent this many hours before the appointment.
  NoShowGraceMinutes:
    Type: AWS::SSM::Parameter
    DependsOn: ReminderOffsetsHours
    Properties:
      Name: !Sub /medislot/${Environment}/config/no-show/grace-minutes
      Type: String
      Value: '30'
      Description: A CONFIRMED appointment this long after its slot end becomes NO_SHOW.
  TestFailRelease:
    Type: AWS::SSM::Parameter
    DependsOn: NoShowGraceMinutes
    Properties:
      Name: !Sub /medislot/${Environment}/config/test/fail-release
      Type: String
      Value: 'false'
      Description: Mandatory Test 3 sets this to true to force a failure in the reschedule release step.

Outputs:
  ConfigPath:
    Description: SSM path holding every business rule.
    Value: !Sub /medislot/${Environment}/config/
    Export:
      Name: !Sub medislot-${Environment}-config-path
