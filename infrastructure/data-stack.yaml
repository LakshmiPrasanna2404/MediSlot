
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot data layer: private encrypted MySQL database,
  DynamoDB state tables, and private S3 storage for profile files.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  DBInstanceClass:
    Type: String
    Description: RDS instance class; confirm regional availability before deployment
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium

  DBAllocatedStorage:
    Type: Number
    Description: Initial RDS storage in GiB
    Default: 20
    MinValue: 20
    MaxValue: 100

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ---------------------------------------------------------
  # RDS: relational system of record
  # ---------------------------------------------------------

  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'MediSlot ${Environment} private database subnets'
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az1-id'
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az2-id'
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotMySQL:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      DBName: medislot
      MasterUsername: medislotadmin
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [IsProd, true, false]
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-sg-id'
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB: slot capacity and temporary reservation state
  # slotId + recordId allow capacity and hold records per slot.
  # Application code must use this exact key contract.
  # ---------------------------------------------------------

  SlotReservationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-slot-reservations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB: waitlist offers
  # ---------------------------------------------------------

  WaitlistOffersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-waitlist-offers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: offerId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: offerId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB: JWT revocation denylist
  # ---------------------------------------------------------

  TokenRevocationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-token-revocations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB: active refresh-token sessions
  # Store SHA-256 token hashes, never raw refresh tokens.
  # ---------------------------------------------------------

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-refresh-tokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB: idempotency keys for safe retry handling
  # ---------------------------------------------------------

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB: notification dispatch/deduplication state
  # ---------------------------------------------------------

  NotificationDispatchTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-notification-dispatch'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatchId
          AttributeType: S
      KeySchema:
        - AttributeName: dispatchId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # S3: private doctor profile files
  # No prescription-document storage is included.
  # ---------------------------------------------------------

  DoctorProfileFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-files'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorProfileFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DoctorProfileFilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DoctorProfileFilesBucket.Arn
              - !Sub '${DoctorProfileFilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------
  # SSM database parameters bootstrap
  # RDS owns the master secret; this custom resource copies its
  # username and password into application SSM parameters.
  # Password is stored as SecureString (not plain String).
  # ---------------------------------------------------------

  DatabaseParametersBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'medislot-${Environment}-db-ssm-bootstrap-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: DatabaseSecretToSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOnlyRDSManagedSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
              - Sid: WriteOnlyMediSlotDatabaseParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/database/username'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/database/password'

  DatabaseParametersBootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-db-ssm-bootstrap'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DatabaseParametersBootstrapRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          sm = boto3.client('secretsmanager')
          ssm = boto3.client('ssm')

          def send(event, context, status, data=None, reason=None):
              body = {
                  'Status': status,
                  'Reason': reason or ('See CloudWatch log stream: ' + context.log_stream_name),
                  'PhysicalResourceId': event.get('PhysicalResourceId', 'medislot-db-ssm-parameters'),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }
              encoded = json.dumps(body).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=encoded, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(encoded))})
              urllib.request.urlopen(req, timeout=10).read()

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      send(event, context, 'SUCCESS')
                      return
                  props = event['ResourceProperties']
                  secret = sm.get_secret_value(SecretId=props['SecretArn'])
                  creds = json.loads(secret['SecretString'])
                  username = creds.get('username')
                  password = creds.get('password')
                  if not username or not password:
                      raise ValueError('RDS secret did not contain username and password fields')
                  ssm.put_parameter(Name=props['UsernameParameter'], Value=username,
                                    Type='String', Overwrite=True)
                  ssm.put_parameter(Name=props['PasswordParameter'], Value=password,
                                    Type='SecureString', Overwrite=True)
                  send(event, context, 'SUCCESS', {'UsernameParameter': props['UsernameParameter']})
              except Exception as exc:
                  # Do not include secret values in logs or the CloudFormation response.
                  print('Database SSM parameter bootstrap failed:', type(exc).__name__)
                  try:
                      send(event, context, 'FAILED', reason='Database SSM parameter bootstrap failed; check Lambda logs.')
                  except Exception:
                      pass
                  raise

  DatabaseParametersBootstrap:
    Type: Custom::MediSlotDatabaseParameters
    DependsOn:
      - MediSlotMySQL
      - DatabaseParametersBootstrapRole
    Properties:
      ServiceToken: !GetAtt DatabaseParametersBootstrapFunction.Arn
      SecretArn: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
      UsernameParameter: !Sub '/medislot/${Environment}/database/username'
      PasswordParameter: !Sub '/medislot/${Environment}/database/password'

Outputs:
  DBInstanceIdentifier:
    Description: RDS instance identifier
    Value: !Ref MediSlotMySQL
    Export:
      Name: !Sub 'medislot-${Environment}-db-instance-id'

  DBEndpointAddress:
    Description: Private RDS endpoint address
    Value: !GetAtt MediSlotMySQL.Endpoint.Address
    Export:
      Name: !Sub 'medislot-${Environment}-db-endpoint'

  DBEndpointPort:
    Description: RDS MySQL port
    Value: !GetAtt MediSlotMySQL.Endpoint.Port
    Export:
      Name: !Sub 'medislot-${Environment}-db-port'

  DBName:
    Description: Application database name
    Value: medislot
    Export:
      Name: !Sub 'medislot-${Environment}-db-name'

  DBMasterSecretArn:
    Description: ARN of the RDS-managed master credentials secret
    Value: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
    Export:
      Name: !Sub 'medislot-${Environment}-db-master-secret-arn'

  SlotReservationsTableName:
    Value: !Ref SlotReservationsTable
    Export:
      Name: !Sub 'medislot-${Environment}-slot-reservations-table-name'

  SlotReservationsTableArn:
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slot-reservations'
    Export:
      Name: !Sub 'medislot-${Environment}-slot-reservations-table-arn'

  WaitlistOffersTableName:
    Value: !Ref WaitlistOffersTable
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-offers-table-name'

  WaitlistOffersTableArn:
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist-offers'
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-offers-table-arn'

  TokenRevocationsTableName:
    Value: !Ref TokenRevocationsTable
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-name'

  TokenRevocationsTableArn:
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations'
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-arn'

  RefreshTokensTableName:
    Description: DynamoDB table for hashed refresh-token sessions
    Value: !Ref RefreshTokensTable
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-name'

  RefreshTokensTableArn:
    Description: ARN of the refresh-token sessions table
    Value: !GetAtt RefreshTokensTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-arn'

  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-name'

  IdempotencyTableArn:
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-idempotency'
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-arn'

  NotificationDispatchTableName:
    Value: !Ref NotificationDispatchTable
    Export:
      Name: !Sub 'medislot-${Environment}-notification-dispatch-table-name'

  NotificationDispatchTableArn:
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-notification-dispatch'
    Export:
      Name: !Sub 'medislot-${Environment}-notification-dispatch-table-arn'

  DoctorProfileFilesBucketName:
    Value: !Ref DoctorProfileFilesBucket
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-name'

  DoctorProfileFilesBucketArn:
    Value: !GetAtt DoctorProfileFilesBucket.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-arn'
