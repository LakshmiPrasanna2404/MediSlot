AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot data stack. Creates the private MySQL database, applies the
  transport-security policy to the existing doctor profile files bucket,
  and exports references to existing DynamoDB tables.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment.
    AllowedValues: [dev, prod]

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class.
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: Initial RDS storage in GiB.
    MinValue: 20
    MaxValue: 1000

  DBMaxAllocatedStorage:
    Type: Number
    Default: 100
    Description: Maximum RDS autoscaling storage in GiB.
    MinValue: 20
    MaxValue: 1000

  DBName:
    Type: String
    Default: medislot
    Description: MySQL application database name.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

  DBMasterUsername:
    Type: String
    Default: medislotadmin
    Description: RDS master username; RDS manages the password.
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'MediSlot ${Environment} private database subnets'
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az1-id'
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az2-id'
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotMySQL:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [IsProd, true, false]
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-sg-id'
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # This bucket already exists in the AWS account. Do not try to create it again.
  # CloudFormation manages only the bucket policy.
  DoctorProfileFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files'
              - !Sub 'arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DBInstanceIdentifier:
    Description: RDS instance identifier.
    Value: !Ref MediSlotMySQL
    Export:
      Name: !Sub 'medislot-${Environment}-db-instance-id'

  DBEndpointAddress:
    Description: Private RDS endpoint address.
    Value: !GetAtt MediSlotMySQL.Endpoint.Address
    Export:
      Name: !Sub 'medislot-${Environment}-db-endpoint'

  DBEndpointPort:
    Description: RDS MySQL port.
    Value: !GetAtt MediSlotMySQL.Endpoint.Port
    Export:
      Name: !Sub 'medislot-${Environment}-db-port'

  ApplicationDBName:
    Description: Application database name.
    Value: !Ref DBName
    Export:
      Name: !Sub 'medislot-${Environment}-db-name'

  DBMasterSecretArn:
    Description: ARN of the RDS-managed master credentials secret.
    Value: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
    Export:
      Name: !Sub 'medislot-${Environment}-db-master-secret-arn'

  RefreshTokensTableName:
    Description: Existing refresh tokens table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-refresh-tokens'
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-name'

  RefreshTokensTableArn:
    Description: Existing refresh tokens table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-refresh-tokens'
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-arn'

  TokenRevocationsTableName:
    Description: Existing token revocations table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-token-revocations'
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-name'

  TokenRevocationsTableArn:
    Description: Existing token revocations table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations'
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-arn'

  IdempotencyTableName:
    Description: Existing idempotency table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-idempotency'
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-name'

  IdempotencyTableArn:
    Description: Existing idempotency table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-idempotency'
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-arn'

  SlotsTableName:
    Description: Existing slots table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-slots'
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-name'

  SlotsTableArn:
    Description: Existing slots table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots'
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-arn'

  SeatsTableName:
    Description: Existing seats table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-seats'
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-name'

  SeatsTableArn:
    Description: Existing seats table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats'
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-arn'

  WaitlistTableName:
    Description: Existing waitlist table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-waitlist'
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-name'

  WaitlistTableArn:
    Description: Existing waitlist table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist'
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-arn'

  HoldOffersTableName:
    Description: Existing hold offers table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-hold-offers'
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-name'

  HoldOffersTableArn:
    Description: Existing hold offers table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers'
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-arn'

  DispatchLogTableName:
    Description: Existing dispatch log table name; not recreated by this stack.
    Value: !Sub 'medislot-${Environment}-dispatch-log'
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-name'

  DispatchLogTableArn:
    Description: Existing dispatch log table ARN.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-dispatch-log'
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-arn'

  DoctorProfileFilesBucketName:
    Description: Existing doctor profile files bucket used by this stack.
    Value: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files'
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-name'

  DoctorProfileFilesBucketArn:
    Description: Existing doctor profile files bucket ARN.
    Value: !Sub 'arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files'
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-arn'
