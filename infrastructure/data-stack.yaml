AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot data layer: private encrypted MySQL database, eight DynamoDB
  tables matching the final MediSlot schema, and private doctor profile photo storage.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment; must be supplied during deployment.
    AllowedValues:
      - dev
      - prod

  DBInstanceClass:
    Type: String
    Description: RDS instance class; confirm regional availability before deployment.
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium

  DBAllocatedStorage:
    Type: Number
    Description: Initial RDS storage in GiB.
    MinValue: 20
    MaxValue: 1000

  DBMaxAllocatedStorage:
    Type: Number
    Description: Maximum RDS autoscaling storage in GiB; must be at least DBAllocatedStorage.
    MinValue: 20
    MaxValue: 1000

  DBName:
    Type: String
    Description: MySQL application database name.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

  DBMasterUsername:
    Type: String
    Description: RDS master username; the password is generated and managed by RDS.
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

  BootstrapLambdaRuntime:
    Type: String
    Description: Python runtime for the database-parameter bootstrap Lambda.
    AllowedValues:
      - python3.12

  BootstrapLambdaTimeout:
    Type: Number
    Description: Timeout in seconds for the database-parameter bootstrap Lambda.
    MinValue: 1
    MaxValue: 900

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ---------------------------------------------------------
  # RDS MySQL
  # ---------------------------------------------------------

  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'MediSlot ${Environment} private database subnets'
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az1-id'
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az2-id'
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotMySQL:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [IsProd, true, false]
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-sg-id'
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 1: refresh tokens
  # PK: tokenHash | TTL: expiresAt
  # ---------------------------------------------------------

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-refresh-tokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 2: token revocations
  # PK: jti | TTL: expiresAt
  # ---------------------------------------------------------

  TokenRevocationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-token-revocations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 3: slots
  # PK: slotId
  # GSI_Doctor_Slots: doctorId (PK) + startTime (SK)
  # ---------------------------------------------------------

  SlotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-slots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: doctorId
          AttributeType: S
        - AttributeName: startTime
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Doctor_Slots
          KeySchema:
            - AttributeName: doctorId
              KeyType: HASH
            - AttributeName: startTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 4: seats
  # PK: slotId | SK: patientId
  # TTL: holdExpiresAt (set only for temporary HELD items)
  # ---------------------------------------------------------

  SeatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-seats'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: patientId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: holdExpiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 5: waitlist
  # PK: slotId | SK: joinedAtPatientId
  # ---------------------------------------------------------

  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-waitlist'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: joinedAtPatientId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: joinedAtPatientId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 6: hold offers
  # PK: offerId | TTL: expiresAt
  # GSI_Patient_Offers: patientId (PK) + createdAt (SK)
  # GSI_Slot_Offers: slotId (PK) + createdAt (SK)
  # ---------------------------------------------------------

  HoldOffersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-hold-offers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: offerId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: offerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Patient_Offers
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_Slot_Offers
          KeySchema:
            - AttributeName: slotId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 7: idempotency
  # PK: idempotencyKey | TTL: expiresAt
  # ---------------------------------------------------------

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 8: dispatch log
  # PK: dispatchKey | no TTL in the final schema
  # ---------------------------------------------------------

  DispatchLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-dispatch-log'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatchKey
          AttributeType: S
      KeySchema:
        - AttributeName: dispatchKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # S3: private doctor profile photos only
  # ---------------------------------------------------------

  DoctorProfileFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-files'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorProfileFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DoctorProfileFilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DoctorProfileFilesBucket.Arn
              - !Sub '${DoctorProfileFilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------
  # SSM database parameters bootstrap
  # RDS manages the master secret; this custom resource copies
  # username and password into application SSM parameters.
  # ---------------------------------------------------------

  DatabaseParametersBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'medislot-${Environment}-db-ssm-bootstrap-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: DatabaseSecretToSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOnlyRDSManagedSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
              - Sid: WriteOnlyMediSlotDatabaseParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/database/username'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/database/password'

  DatabaseParametersBootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-db-ssm-bootstrap'
      Runtime: !Ref BootstrapLambdaRuntime
      Handler: index.handler
      Role: !GetAtt DatabaseParametersBootstrapRole.Arn
      Timeout: !Ref BootstrapLambdaTimeout
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          sm = boto3.client('secretsmanager')
          ssm = boto3.client('ssm')

          def send(event, context, status, data=None, reason=None):
              body = {
                  'Status': status,
                  'Reason': reason or ('See CloudWatch log stream: ' + context.log_stream_name),
                  'PhysicalResourceId': event.get(
                      'PhysicalResourceId',
                      'medislot-db-ssm-parameters'
                  ),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }
              encoded = json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=encoded,
                  method='PUT',
                  headers={
                      'content-type': '',
                      'content-length': str(len(encoded))
                  }
              )
              urllib.request.urlopen(req, timeout=10).read()

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      send(event, context, 'SUCCESS')
                      return

                  props = event['ResourceProperties']
                  secret = sm.get_secret_value(SecretId=props['SecretArn'])
                  creds = json.loads(secret['SecretString'])
                  username = creds.get('username')
                  password = creds.get('password')

                  if not username or not password:
                      raise ValueError(
                          'RDS secret did not contain username and password fields'
                      )

                  ssm.put_parameter(
                      Name=props['UsernameParameter'],
                      Value=username,
                      Type='String',
                      Overwrite=True
                  )
                  ssm.put_parameter(
                      Name=props['PasswordParameter'],
                      Value=password,
                      Type='SecureString',
                      Overwrite=True
                  )

                  send(
                      event,
                      context,
                      'SUCCESS',
                      {'UsernameParameter': props['UsernameParameter']}
                  )
              except Exception as exc:
                  print(
                      'Database SSM parameter bootstrap failed:',
                      type(exc).__name__
                  )
                  try:
                      send(
                          event,
                          context,
                          'FAILED',
                          reason=(
                              'Database SSM parameter bootstrap failed; '
                              'check Lambda logs.'
                          )
                      )
                  except Exception:
                      pass
                  raise

  DatabaseParametersBootstrap:
    Type: Custom::MediSlotDatabaseParameters
    DependsOn:
      - MediSlotMySQL
      - DatabaseParametersBootstrapRole
    Properties:
      ServiceToken: !GetAtt DatabaseParametersBootstrapFunction.Arn
      SecretArn: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
      UsernameParameter: !Sub '/medislot/${Environment}/database/username'
      PasswordParameter: !Sub '/medislot/${Environment}/database/password'

Outputs:
  DBInstanceIdentifier:
    Description: RDS instance identifier
    Value: !Ref MediSlotMySQL
    Export:
      Name: !Sub 'medislot-${Environment}-db-instance-id'

  DBEndpointAddress:
    Description: Private RDS endpoint address
    Value: !GetAtt MediSlotMySQL.Endpoint.Address
    Export:
      Name: !Sub 'medislot-${Environment}-db-endpoint'

  DBEndpointPort:
    Description: RDS MySQL port
    Value: !GetAtt MediSlotMySQL.Endpoint.Port
    Export:
      Name: !Sub 'medislot-${Environment}-db-port'

  DBName:
    Description: Application database name
    Value: !Ref DBName
    Export:
      Name: !Sub 'medislot-${Environment}-db-name'

  DBMasterSecretArn:
    Description: ARN of the RDS-managed master credentials secret
    Value: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
    Export:
      Name: !Sub 'medislot-${Environment}-db-master-secret-arn'

  RefreshTokensTableName:
    Value: !Ref RefreshTokensTable
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-name'

  RefreshTokensTableArn:
    Value: !GetAtt RefreshTokensTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-arn'

  TokenRevocationsTableName:
    Value: !Ref TokenRevocationsTable
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-name'

  TokenRevocationsTableArn:
    Value: !GetAtt TokenRevocationsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-arn'

  SlotsTableName:
    Value: !Ref SlotsTable
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-name'

  SlotsTableArn:
    Value: !GetAtt SlotsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-arn'

  SeatsTableName:
    Value: !Ref SeatsTable
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-name'

  SeatsTableArn:
    Value: !GetAtt SeatsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-arn'

  WaitlistTableName:
    Value: !Ref WaitlistTable
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-name'

  WaitlistTableArn:
    Value: !GetAtt WaitlistTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-arn'

  HoldOffersTableName:
    Value: !Ref HoldOffersTable
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-name'

  HoldOffersTableArn:
    Value: !GetAtt HoldOffersTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-arn'

  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-name'

  IdempotencyTableArn:
    Value: !GetAtt IdempotencyTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-arn'

  DispatchLogTableName:
    Value: !Ref DispatchLogTable
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-name'

  DispatchLogTableArn:
    Value: !GetAtt DispatchLogTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-arn'

  DoctorProfileFilesBucketName:
    Value: !Ref DoctorProfileFilesBucket
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-name'

  DoctorProfileFilesBucketArn:
    Value: !GetAtt DoctorProfileFilesBucket.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-arn'
