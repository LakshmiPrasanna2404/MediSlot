AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot data stack. RDS MySQL in the private RDS subnets, every DynamoDB
  table from the final DynamoDB schema (refresh-tokens, token-revocations,
  slots, seats, waitlist, hold-offers, idempotency, dispatch-log) and the S3
  bucket for doctor profile photos. Tables and buckets keep their data if the
  stack is deleted (Retain).

Parameters:
  Environment:
    Type: String
    Description: Deployment environment.
    AllowedValues: [dev, prod]

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class.
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: Initial RDS storage in GiB.
    MinValue: 20
    MaxValue: 1000

  DBMaxAllocatedStorage:
    Type: Number
    Default: 100
    Description: Maximum RDS autoscaling storage in GiB.
    MinValue: 20
    MaxValue: 1000

  DBName:
    Type: String
    Default: medislot
    Description: Application database name.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ---------------------------------------------------------------------------
  # RDS MySQL (system of record), private subnets only
  # ---------------------------------------------------------------------------
  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'MediSlot ${Environment} private database subnets'
      SubnetIds:
        - Fn::ImportValue: !Sub 'medislot-${Environment}-rds-subnet-az1-id'
        - Fn::ImportValue: !Sub 'medislot-${Environment}-rds-subnet-az2-id'
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotMySQL:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_16
            comment: 'Known gap on the existing dev instance; encrypting needs snapshot, encrypted copy and restore (docs/runbook.md, RDS encryption). New environments set StorageEncrypted to true.'
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      # Seeded once per environment (docs/runbook.md). The password is an SSM
      # SecureString resolved by CloudFormation; it never appears in a template.
      MasterUsername: !Sub '{{resolve:ssm:/medislot/${Environment}/db/username}}'
      MasterUserPassword: !Sub '{{resolve:ssm-secure:/medislot/${Environment}/db/password}}'
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      # The dev instance was created unencrypted. Turning encryption on for an
      # existing instance means a snapshot, an encrypted copy and a restore
      # (a replacement), so it is planned as a separate change. A new
      # environment should be created with this set to true (aws/rds key).
      StorageEncrypted: false
      PubliclyAccessible: false
      MultiAZ: false
      # 1 day in dev: Free Tier accounts reject longer automated backup
      # retention, and the existing instance is already on 1 day, so the
      # database is not modified by this stack. 7 days in prod.
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub 'medislot-${Environment}-rds-sg-id'
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # DynamoDB: authentication
  # ---------------------------------------------------------------------------
  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-refresh-tokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  TokenRevocationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-token-revocations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # DynamoDB: booking
  # ---------------------------------------------------------------------------
  # slotId = <doctorId>#<consultationTypeId>#<YYYYMMDD>#<HHMM> (deterministic).
  # The contended write target: conditional writes on version and capacity.
  SlotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-slots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: doctorId
          AttributeType: S
        - AttributeName: startTime
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Doctor_Slots
          KeySchema:
            - AttributeName: doctorId
              KeyType: HASH
            - AttributeName: startTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SeatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-seats'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: patientId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # DynamoDB: waitlist and hold offers
  # ---------------------------------------------------------------------------
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-waitlist'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: queueOrder
          AttributeType: N
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: patientId
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: LSI_QueueOrder
          KeySchema:
            - AttributeName: slotId
              KeyType: HASH
            - AttributeName: queueOrder
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      GlobalSecondaryIndexes:
        - IndexName: GSI_Patient_Waitlists
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  HoldOffersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-hold-offers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: offerId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: offerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Patient_Offers
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_Slot_Offers
          KeySchema:
            - AttributeName: slotId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # ttl is cleanup only; expiresAt drives the business logic.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # DynamoDB: idempotency and notification dispatch
  # ---------------------------------------------------------------------------
  # Key "patientId#key" = <patientId>#<Idempotency-Key header>, so one
  # patient's key can never collide with another's. Records expire after 24 h.
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: 'patientId#key'
          AttributeType: S
      KeySchema:
        - AttributeName: 'patientId#key'
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # dispatchKey = <appointmentId>#<interval or event>#<recipient>. No TTL.
  DispatchLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-dispatch-log'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatchKey
          AttributeType: S
      KeySchema:
        - AttributeName: dispatchKey
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # S3: doctor profile photos only (uploaded with pre-signed POSTs)
  # ---------------------------------------------------------------------------
  DoctorProfileFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReplacedPhotoVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # The browser posts the photo straight to S3 with the pre-signed form.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorProfileFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DoctorProfileFilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DoctorProfileFilesBucket.Arn
              - !Sub '${DoctorProfileFilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  ArtifactBucketName:
    Description: >-
      Private S3 bucket for Lambda, web app and template packages. The pipeline
      creates it on its first run if it does not exist; it is not part of a stack.
    Value: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-artifacts'
    Export:
      Name: !Sub 'medislot-${Environment}-artifact-bucket-name'

  ArtifactBucketArn:
    Description: ARN of the artifacts bucket.
    Value: !Sub 'arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-artifacts'
    Export:
      Name: !Sub 'medislot-${Environment}-artifact-bucket-arn'

  DBInstanceIdentifier:
    Description: RDS instance identifier.
    Value: !Ref MediSlotMySQL
    Export:
      Name: !Sub 'medislot-${Environment}-db-instance-id'

  DBEndpointAddress:
    Description: Private RDS endpoint address.
    Value: !GetAtt MediSlotMySQL.Endpoint.Address
    Export:
      Name: !Sub 'medislot-${Environment}-db-endpoint'

  DBEndpointPort:
    Description: RDS MySQL port.
    Value: !GetAtt MediSlotMySQL.Endpoint.Port
    Export:
      Name: !Sub 'medislot-${Environment}-db-port'

  ApplicationDBName:
    Description: Application database name.
    Value: !Ref DBName
    Export:
      Name: !Sub 'medislot-${Environment}-db-name'

  DBUsernameParameterName:
    Description: SSM parameter containing the database username.
    Value: !Sub '/medislot/${Environment}/db/username'
    Export:
      Name: !Sub 'medislot-${Environment}-db-username-parameter'

  DBPasswordParameterName:
    Description: SSM SecureString parameter containing the database password.
    Value: !Sub '/medislot/${Environment}/db/password'
    Export:
      Name: !Sub 'medislot-${Environment}-db-password-parameter'

  RefreshTokensTableName:
    Value: !Ref RefreshTokensTable
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-name'

  RefreshTokensTableArn:
    Value: !GetAtt RefreshTokensTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-arn'

  TokenRevocationsTableName:
    Value: !Ref TokenRevocationsTable
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-name'

  TokenRevocationsTableArn:
    Value: !GetAtt TokenRevocationsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-arn'

  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-name'

  IdempotencyTableArn:
    Value: !GetAtt IdempotencyTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-arn'

  SlotsTableName:
    Value: !Ref SlotsTable
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-name'

  SlotsTableArn:
    Value: !GetAtt SlotsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-arn'

  SeatsTableName:
    Value: !Ref SeatsTable
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-name'

  SeatsTableArn:
    Value: !GetAtt SeatsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-arn'

  WaitlistTableName:
    Value: !Ref WaitlistTable
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-name'

  WaitlistTableArn:
    Value: !GetAtt WaitlistTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-arn'

  HoldOffersTableName:
    Value: !Ref HoldOffersTable
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-name'

  HoldOffersTableArn:
    Value: !GetAtt HoldOffersTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-arn'

  DispatchLogTableName:
    Value: !Ref DispatchLogTable
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-name'

  DispatchLogTableArn:
    Value: !GetAtt DispatchLogTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-arn'

  DoctorProfileFilesBucketName:
    Value: !Ref DoctorProfileFilesBucket
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-name'

  DoctorProfileFilesBucketArn:
    Value: !GetAtt DoctorProfileFilesBucket.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-arn'
