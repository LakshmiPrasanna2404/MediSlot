AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot data layer: private encrypted MySQL database, eight DynamoDB
  tables matching the final MediSlot schema, and private doctor profile photo storage.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment; must be supplied during deployment.
    AllowedValues:
      - dev
      - prod

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class; default is suitable for the dev environment.
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: Initial RDS storage in GiB.
    MinValue: 20
    MaxValue: 1000

  DBMaxAllocatedStorage:
    Type: Number
    Default: 100
    Description: Maximum RDS autoscaling storage in GiB; must be at least DBAllocatedStorage.
    MinValue: 20
    MaxValue: 1000

  DBName:
    Type: String
    Default: medislot
    Description: MySQL application database name.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

  DBMasterUsername:
    Type: String
    Default: medislotadmin
    Description: RDS master username; the password is generated and managed by RDS.
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ConstraintDescription: Must begin with a letter and contain only letters and numbers.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ---------------------------------------------------------
  # RDS MySQL
  # ---------------------------------------------------------

  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'MediSlot ${Environment} private database subnets'
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az1-id'
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-subnet-az2-id'
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotMySQL:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [IsProd, true, false]
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: 'medislot-${Environment}-rds-sg-id'
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 3: slots
  # PK: slotId
  # GSI_Doctor_Slots: doctorId (PK) + startTime (SK)
  # ---------------------------------------------------------

  SlotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-slots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: doctorId
          AttributeType: S
        - AttributeName: startTime
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Doctor_Slots
          KeySchema:
            - AttributeName: doctorId
              KeyType: HASH
            - AttributeName: startTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 4: seats
  # PK: slotId | SK: patientId
  # TTL: holdExpiresAt (set only for temporary HELD items)
  # ---------------------------------------------------------

  SeatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-seats'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: patientId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: holdExpiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 5: waitlist
  # PK: slotId | SK: joinedAtPatientId
  # ---------------------------------------------------------

  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-waitlist'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: joinedAtPatientId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH
        - AttributeName: joinedAtPatientId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 6: hold offers
  # PK: offerId | TTL: expiresAt
  # GSI_Patient_Offers: patientId (PK) + createdAt (SK)
  # GSI_Slot_Offers: slotId (PK) + createdAt (SK)
  # ---------------------------------------------------------

  HoldOffersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-hold-offers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: offerId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: offerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Patient_Offers
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_Slot_Offers
          KeySchema:
            - AttributeName: slotId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # DynamoDB 8: dispatch log
  # PK: dispatchKey | no TTL in the final schema
  # ---------------------------------------------------------

  DispatchLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'medislot-${Environment}-dispatch-log'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatchKey
          AttributeType: S
      KeySchema:
        - AttributeName: dispatchKey
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # S3: private doctor profile photos only
  # ---------------------------------------------------------

  DoctorProfileFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorProfileFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DoctorProfileFilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DoctorProfileFilesBucket.Arn
              - !Sub '${DoctorProfileFilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DBInstanceIdentifier:
    Description: RDS instance identifier
    Value: !Ref MediSlotMySQL
    Export:
      Name: !Sub 'medislot-${Environment}-db-instance-id'

  DBEndpointAddress:
    Description: Private RDS endpoint address
    Value: !GetAtt MediSlotMySQL.Endpoint.Address
    Export:
      Name: !Sub 'medislot-${Environment}-db-endpoint'

  DBEndpointPort:
    Description: RDS MySQL port
    Value: !GetAtt MediSlotMySQL.Endpoint.Port
    Export:
      Name: !Sub 'medislot-${Environment}-db-port'

  DBName:
    Description: Application database name
    Value: !Ref DBName
    Export:
      Name: !Sub 'medislot-${Environment}-db-name'

  DBMasterSecretArn:
    Description: ARN of the RDS-managed master credentials secret
    Value: !GetAtt MediSlotMySQL.MasterUserSecret.SecretArn
    Export:
      Name: !Sub 'medislot-${Environment}-db-master-secret-arn'

  RefreshTokensTableName:
    Description: Name of the pre-existing refresh tokens table (kept outside this stack to avoid replacement).
    Value: !Sub 'medislot-${Environment}-refresh-tokens'
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-name'

  RefreshTokensTableArn:
    Description: ARN of the pre-existing refresh tokens table.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-refresh-tokens'
    Export:
      Name: !Sub 'medislot-${Environment}-refresh-tokens-table-arn'

  TokenRevocationsTableName:
    Description: Name of the pre-existing token revocations table (kept outside this stack to avoid replacement).
    Value: !Sub 'medislot-${Environment}-token-revocations'
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-name'

  TokenRevocationsTableArn:
    Description: ARN of the pre-existing token revocations table.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations'
    Export:
      Name: !Sub 'medislot-${Environment}-token-revocations-table-arn'

  SlotsTableName:
    Value: !Ref SlotsTable
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-name'

  SlotsTableArn:
    Value: !GetAtt SlotsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-slots-table-arn'

  SeatsTableName:
    Value: !Ref SeatsTable
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-name'

  SeatsTableArn:
    Value: !GetAtt SeatsTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-seats-table-arn'

  WaitlistTableName:
    Value: !Ref WaitlistTable
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-name'

  WaitlistTableArn:
    Value: !GetAtt WaitlistTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-waitlist-table-arn'

  HoldOffersTableName:
    Value: !Ref HoldOffersTable
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-name'

  HoldOffersTableArn:
    Value: !GetAtt HoldOffersTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-hold-offers-table-arn'

  IdempotencyTableName:
    Description: Name of the pre-existing idempotency table (kept outside this stack to avoid replacement).
    Value: !Sub 'medislot-${Environment}-idempotency'
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-name'

  IdempotencyTableArn:
    Description: ARN of the pre-existing idempotency table.
    Value: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-idempotency'
    Export:
      Name: !Sub 'medislot-${Environment}-idempotency-table-arn'

  DispatchLogTableName:
    Value: !Ref DispatchLogTable
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-name'

  DispatchLogTableArn:
    Value: !GetAtt DispatchLogTable.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-dispatch-log-table-arn'

  DoctorProfileFilesBucketName:
    Value: !Ref DoctorProfileFilesBucket
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-name'

  DoctorProfileFilesBucketArn:
    Value: !GetAtt DoctorProfileFilesBucket.Arn
    Export:
      Name: !Sub 'medislot-${Environment}-doctor-files-bucket-arn'
