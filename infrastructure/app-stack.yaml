AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot application stack. Adds doctor and patient application Lambda routes
  and the JWT Lambda authorizer to the shared API created by api-stack.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - prod

  AppCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the application Lambda deployment package

  AppCodeS3Key:
    Type: String
    Description: S3 object key for the application Lambda deployment package

  AppHandler:
    Type: String
    Default: app_handler.lambda_handler
    Description: Python module and handler for the application Lambda

  PythonRuntime:
    Type: String
    Default: python3.12
    AllowedValues:
      - python3.12

  AppTimeout:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 30
    Description: Application Lambda timeout in seconds; must not exceed the HTTP API integration timeout

  AppMemorySize:
    Type: Number
    Default: 512
    AllowedValues:
      - 256
      - 512
      - 1024
      - 1536
      - 2048

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90


Resources:
  # ---------------------------------------------------------
  # Application Lambda logs
  # ---------------------------------------------------------
  AppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-app
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------
  # Main application Lambda
  # ---------------------------------------------------------
  AppFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - AppFunctionLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-app
      Description: MediSlot doctor and patient application operations
      Runtime: !Ref PythonRuntime
      Handler: !Ref AppHandler
      Role:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-app-role-arn
      Timeout: !Ref AppTimeout
      MemorySize: !Ref AppMemorySize
      Architectures:
        - x86_64
      Code:
        S3Bucket: !Ref AppCodeS3Bucket
        S3Key: !Ref AppCodeS3Key
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-db-endpoint

          DB_PORT:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-db-port

          DB_NAME:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-db-name

          # Corrected to match DATA stack parameter paths
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password

          SLOTS_TABLE: !Sub medislot-${Environment}-slots
          SEATS_TABLE: !Sub medislot-${Environment}-seats
          WAITLIST_TABLE: !Sub medislot-${Environment}-waitlist
          HOLD_OFFERS_TABLE: !Sub medislot-${Environment}-hold-offers
          IDEMPOTENCY_TABLE: !Sub medislot-${Environment}-idempotency
          DISPATCH_LOG_TABLE: !Sub medislot-${Environment}-dispatch-log

          DOCTOR_FILES_BUCKET:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-doctor-files-bucket-name

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # Shared HTTP API is created by api-stack; this stack adds application routes.

  # Protected application Lambda integration
  AppApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-api-id
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt AppFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  # Existing JWT Lambda authorizer
  AppJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-api-id
      Name: !Sub medislot-${Environment}-jwt-authorizer
      AuthorizerType: REQUEST
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: medislot-${Environment}-authorizer-function-arn
      IdentitySource:
        - $request.header.Authorization
      AuthorizerPayloadFormatVersion: '1.0'
      EnableSimpleResponses: false
      AuthorizerResultTtlInSeconds: 0


  # ---------------------------------------------------------
  # Protected application routes
  # ---------------------------------------------------------
  AppDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-api-id
      RouteKey: '$default'
      Target: !Sub integrations/${AppApiIntegration}
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AppJwtAuthorizer

  # Public doctor discovery routes override the protected $default route.
  PublicDoctorsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-api-id
      RouteKey: 'GET /doctors'
      Target: !Sub integrations/${AppApiIntegration}
      AuthorizationType: NONE

  PublicDoctorProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-api-id
      RouteKey: 'GET /doctors/{doctorId}'
      Target: !Sub integrations/${AppApiIntegration}
      AuthorizationType: NONE

  PublicDoctorSlotsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-api-id
      RouteKey: 'GET /doctors/{doctorId}/slots'
      Target: !Sub integrations/${AppApiIntegration}
      AuthorizationType: NONE

  # ---------------------------------------------------------
  # Lambda invocation permissions
  # ---------------------------------------------------------
  AppApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AppFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*
        - ApiId:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-api-id


  AppAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-authorizer-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/authorizers/${AuthorizerId}
        - ApiId:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-api-id
          AuthorizerId: !Ref AppJwtAuthorizer


Outputs:
  AppFunctionName:
    Description: MediSlot application Lambda function name
    Value: !Ref AppFunction
    Export:
      Name: !Sub medislot-${Environment}-app-function-name

  AppFunctionArn:
    Description: MediSlot application Lambda function ARN
    Value: !GetAtt AppFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-app-function-arn

  AppApiUrl:
    Description: Base URL for the shared doctor and patient API
    Value:
      Fn::ImportValue:
        Fn::Sub: medislot-${Environment}-api-url
    Export:
      Name: !Sub medislot-${Environment}-app-api-url

  AppApiId:
    Description: Shared API Gateway ID
    Value:
      Fn::ImportValue:
        Fn::Sub: medislot-${Environment}-api-id
    Export:
      Name: !Sub medislot-${Environment}-app-api-id
