AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot application Lambdas, one per function in the architecture diagrams (doctor: profile, photo upload, consultation types, availability and blackouts, schedule, outcome, slot cancel; patient: profile, doctor search, slot lookup, booking, cancel, refund history), the slot-cancel Step Functions workflow, plus the db-migrate function the pipeline runs after each deployment. All run in the private Lambda subnets; API Gateway routes are added by api-stack.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  CodeS3Bucket:
    Type: String
    Description: Artifacts bucket holding the Lambda packages

  DoctorProfileCodeS3Key:
    Type: String
    Description: S3 key of the doctor-profile package (content-addressed, built by scripts/build_lambdas.py)
  PhotoUploadCodeS3Key:
    Type: String
    Description: S3 key of the photo-upload package (content-addressed, built by scripts/build_lambdas.py)
  ConsultationTypesCodeS3Key:
    Type: String
    Description: S3 key of the consultation-types package (content-addressed, built by scripts/build_lambdas.py)
  AvailabilityCodeS3Key:
    Type: String
    Description: S3 key of the availability package (content-addressed, built by scripts/build_lambdas.py)
  ScheduleCodeS3Key:
    Type: String
    Description: S3 key of the schedule package (content-addressed, built by scripts/build_lambdas.py)
  PatientProfileCodeS3Key:
    Type: String
    Description: S3 key of the patient-profile package (content-addressed, built by scripts/build_lambdas.py)
  DoctorSearchCodeS3Key:
    Type: String
    Description: S3 key of the doctor-search package (content-addressed, built by scripts/build_lambdas.py)
  SlotLookupCodeS3Key:
    Type: String
    Description: S3 key of the slot-lookup package (content-addressed, built by scripts/build_lambdas.py)
  DbMigrateCodeS3Key:
    Type: String
    Description: S3 key of the db-migrate package (content-addressed, built by scripts/build_lambdas.py)
  BookingCodeS3Key:
    Type: String
    Description: S3 key of the booking package (content-addressed, built by scripts/build_lambdas.py)
  CancelCodeS3Key:
    Type: String
    Description: S3 key of the cancel package (content-addressed, built by scripts/build_lambdas.py)
  RefundHistoryCodeS3Key:
    Type: String
    Description: S3 key of the refund-history package (content-addressed, built by scripts/build_lambdas.py)
  OutcomeCodeS3Key:
    Type: String
    Description: S3 key of the outcome package (content-addressed, built by scripts/build_lambdas.py)
  SlotCancelCodeS3Key:
    Type: String
    Description: S3 key of the slot-cancel package (content-addressed, built by scripts/build_lambdas.py)

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: CloudWatch log retention period

  # Business rules (frozen rule set). Each one reaches the functions that need it
  # as a CONFIG_* environment variable; a value changes here, never in code.
  BookingWindowDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 90
    Description: Rolling window of materialised slots, in days. Keep equal to BookingWindowDays in the jobs stack.

  MaxLookupDays:
    Type: Number
    Default: 31
    MinValue: 1
    MaxValue: 90
    Description: Longest date range one slot lookup may ask for.

  PhotoMaxUploadBytes:
    Type: Number
    Default: 5242880
    MinValue: 1024
    MaxValue: 10485760
    Description: Largest profile photo a doctor may upload, in bytes (5 MB).

  PhotoUploadUrlSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 3600
    Description: Lifetime of the pre-signed photo upload form, in seconds.

  PhotoViewUrlSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 86400
    Description: Lifetime of a pre-signed photo view link, in seconds.

  SearchDefaultPageSize:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Doctor search page size when the caller gives none.

  SearchMaxPageSize:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 100
    Description: Largest doctor search page size.

  MaxUpcomingPerDoctor:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 20
    Description: Most upcoming (CONFIRMED, not yet started) appointments one patient may hold with the same doctor.

  BookingRetryMaxAttempts:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
    Description: Seat-claim attempts when another booking changed the slot at the same moment (optimistic concurrency).

  BookingRetryBaseMs:
    Type: Number
    Default: 20
    MinValue: 5
    MaxValue: 500
    Description: Base of the exponential backoff (with full jitter) between seat-claim attempts, in milliseconds.

  IdempotencyTtlHours:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 168
    Description: How long a booking Idempotency-Key and its stored answer are kept.

  RefundTierHours:
    Type: String
    Default: '48,24,6'
    AllowedPattern: '^[0-9]+,[0-9]+,[0-9]+$'
    Description: >-
      Patient cancellation tier bounds in hours before the start, descending. With
      48,24,6: more than 48 h, 24 h up to and including 48 h, 6 h up to 24 h, less than 6 h.

  RefundTierPercents:
    Type: String
    Default: '100,75,50,0'
    AllowedPattern: '^[0-9]{1,3},[0-9]{1,3},[0-9]{1,3},[0-9]{1,3}$'
    Description: Refund percentage for each of the four patient cancellation tiers, in the order of RefundTierHours.

  DoctorCancelRefundPercent:
    Type: Number
    Default: 100
    MinValue: 0
    MaxValue: 100
    Description: Refund percentage when the doctor cancels a slot.

  ReminderOffsetsHours:
    Type: String
    Default: '24,2'
    AllowedPattern: '^[0-9]+(,[0-9]+)*$'
    Description: Hours before the start at which reminder emails are sent (one schedule each).

  NoShowGraceMinutes:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 240
    Description: Minutes after the slot end before an unmarked appointment becomes NO_SHOW. Keep equal to NoShowGraceMinutes in the jobs stack.

  RefundsDefaultPageSize:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Refund history page size when the caller gives none.

  RefundsMaxPageSize:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 200
    Description: Largest refund history page size.

Resources:
  DoctorProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-profile
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorProfileFunction:
    Type: AWS::Lambda::Function
    DependsOn: DoctorProfileLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-profile
      Description: 'Doctor Profile: get and update the profile'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-profile-role-arn
      Timeout: 20
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DoctorProfileCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_SLOTS_BOOKING_WINDOW_DAYS: !Ref BookingWindowDays
          CONFIG_PHOTOS_VIEW_URL_SECONDS: !Ref PhotoViewUrlSeconds
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
          DOCTOR_FILES_BUCKET: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-files-bucket-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PhotoUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-photo-upload
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PhotoUploadFunction:
    Type: AWS::Lambda::Function
    DependsOn: PhotoUploadLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-photo-upload
      Description: 'Photo Upload: pre-signed S3 POST for the profile photo'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-photo-upload-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref PhotoUploadCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_PHOTOS_MAX_UPLOAD_BYTES: !Ref PhotoMaxUploadBytes
          CONFIG_PHOTOS_UPLOAD_URL_SECONDS: !Ref PhotoUploadUrlSeconds
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          DOCTOR_FILES_BUCKET: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-files-bucket-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ConsultationTypesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-consultation-types
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ConsultationTypesFunction:
    Type: AWS::Lambda::Function
    DependsOn: ConsultationTypesLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-consultation-types
      Description: 'Consultation Types: create, update, list, delete'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-consultation-types-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref ConsultationTypesCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AvailabilityLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-availability
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AvailabilityFunction:
    Type: AWS::Lambda::Function
    DependsOn: AvailabilityLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-availability
      Description: 'Availability and Blackouts: weekly patterns and blackout dates, then slot sync'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-availability-role-arn
      Timeout: 30
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref AvailabilityCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_SLOTS_BOOKING_WINDOW_DAYS: !Ref BookingWindowDays
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ScheduleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-schedule
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ScheduleFunction:
    Type: AWS::Lambda::Function
    DependsOn: ScheduleLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-schedule
      Description: 'Schedule: day and week view with booked patients'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-schedule-role-arn
      Timeout: 15
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref ScheduleCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PatientProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-patient-profile
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PatientProfileFunction:
    Type: AWS::Lambda::Function
    DependsOn: PatientProfileLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-patient-profile
      Description: 'Patient Profile: get, update, delete'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-patient-profile-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref PatientProfileCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          ACTIVE_TOKENS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-active-tokens-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorSearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-search
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorSearchFunction:
    Type: AWS::Lambda::Function
    DependsOn: DoctorSearchLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-search
      Description: 'Doctor Search: filtered search and public profile'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-search-role-arn
      Timeout: 15
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DoctorSearchCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_PHOTOS_VIEW_URL_SECONDS: !Ref PhotoViewUrlSeconds
          CONFIG_SEARCH_DEFAULT_PAGE_SIZE: !Ref SearchDefaultPageSize
          CONFIG_SEARCH_MAX_PAGE_SIZE: !Ref SearchMaxPageSize
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          DOCTOR_FILES_BUCKET: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-files-bucket-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SlotLookupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-slot-lookup
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SlotLookupFunction:
    Type: AWS::Lambda::Function
    DependsOn: SlotLookupLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-slot-lookup
      Description: 'Slot Lookup: open slots with free seats'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-slot-lookup-role-arn
      Timeout: 15
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref SlotLookupCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_SLOTS_MAX_LOOKUP_DAYS: !Ref MaxLookupDays
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DbMigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-db-migrate
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DbMigrateFunction:
    Type: AWS::Lambda::Function
    DependsOn: DbMigrateLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-db-migrate
      Description: 'Schema migrations and RDS connectivity check (invoked by the pipeline)'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-db-migrate-role-arn
      Timeout: 120
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DbMigrateCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Milestone 5: booking, cancellation and refunds, outcomes, slot cancel
  # ---------------------------------------------------------------------------
  BookingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-booking
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  BookingFunction:
    Type: AWS::Lambda::Function
    DependsOn: BookingLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-booking
      Description: 'Booking: book a seat (idempotent, optimistic concurrency), list and read own appointments'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-booking-role-arn
      Timeout: 30
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref BookingCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_REFUNDS_TIER_HOURS: !Ref RefundTierHours
          CONFIG_REFUNDS_TIER_PERCENTS: !Ref RefundTierPercents
          CONFIG_BOOKING_MAX_UPCOMING_PER_DOCTOR: !Ref MaxUpcomingPerDoctor
