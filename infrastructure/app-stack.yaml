  SlotCancelFunction:
    Type: AWS::Lambda::Function
    DependsOn: SlotCancelLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-slot-cancel
      Description: 'Slot Cancel: closes a slot and runs the slot-cancel workflow steps (full refunds)'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-slot-cancel-role-arn
      Timeout: 60
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref SlotCancelCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_REFUNDS_DOCTOR_CANCEL_PERCENT: !Ref DoctorCancelRefundPercent
          CONFIG_REMINDERS_OFFSETS_HOURS: !Ref ReminderOffsetsHours
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
          SEATS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-seats-table-name
          EVENT_BUS_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-event-bus-name
          SCHEDULER_ROLE_ARN: !ImportValue
            Fn::Sub: medislot-${Environment}-scheduler-invoke-role-arn
          SLOT_CANCEL_STATE_MACHINE_ARN: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-slot-cancel
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # Slot cancel workflow (architecture box 5): list the slot's CONFIRMED
  # appointments, cancel them with a Map (5 at a time), list again until none
  # is left (a booking that was committing while the slot closed), then
  # publish SlotCancelled. Every step is the Slot Cancel Lambda and is safe to
  # retry, so each one retries on any error.
  SlotCancelStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub medislot-${Environment}-slot-cancel
      StateMachineType: STANDARD
      RoleArn: !ImportValue
        Fn::Sub: medislot-${Environment}-slot-cancel-workflow-role-arn
      DefinitionSubstitutions:
        StepFunction: !GetAtt SlotCancelFunction.Arn
      Definition:
        Comment: Cancel every booking in a slot the doctor cancelled, with full refunds
        StartAt: ListAppointments
        States:
          ListAppointments:
            Type: Task
            Resource: ${StepFunction}
            Parameters:
              workflowStep: listAppointments
              slotId.$: $.slotId
              round.$: $.list.round
              correlationId.$: $.correlationId
            ResultPath: $.list
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Next: AnyLeft
          AnyLeft:
            Type: Choice
            Choices:
              - Variable: $.list.count
                NumericEquals: 0
                Next: Finish
              - Variable: $.list.round
                NumericGreaterThan: 3
                Next: AppointmentsLeft
            Default: CancelEach
          CancelEach:
            Type: Map
            ItemsPath: $.list.appointmentIds
            MaxConcurrency: 5
            ItemSelector:
              workflowStep: cancelAppointment
              appointmentId.$: $$.Map.Item.Value
              slotId.$: $.slotId
              reason.$: $.reason
              correlationId.$: $.correlationId
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: CancelAppointment
              States:
                CancelAppointment:
                  Type: Task
                  Resource: ${StepFunction}
                  Retry:
                    - ErrorEquals: [States.ALL]
                      IntervalSeconds: 2
                      MaxAttempts: 4
                      BackoffRate: 2
                  End: true
            # Keep the input (slotId, doctorId, reason); the round's results go beside it.
            # (CloudFormation does not allow null, so ResultPath cannot discard them.)
            ResultPath: $.cancelled
            Next: ListAppointments
          Finish:
            Type: Task
            Resource: ${StepFunction}
            Parameters:
              workflowStep: finish
              slotId.$: $.slotId
              doctorId.$: $.doctorId
              reason.$: $.reason
              rounds.$: $.list.round
              correlationId.$: $.correlationId
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            End: true
          AppointmentsLeft:
            Type: Fail
            Error: AppointmentsLeft
            Cause: Bookings were still CONFIRMED after three rounds; see the Slot Cancel Lambda log.
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

