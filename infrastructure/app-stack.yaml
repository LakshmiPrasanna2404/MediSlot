AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot application Lambdas, one per function in the architecture diagrams (doctor: profile, photo upload, consultation types, availability and blackouts, schedule; patient: profile, doctor search, slot lookup) plus the db-migrate function the pipeline runs after each deployment. All run in the private Lambda subnets; API Gateway routes are added by api-stack.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  CodeS3Bucket:
    Type: String
    Description: Artifacts bucket holding the Lambda packages

  DoctorProfileCodeS3Key:
    Type: String
    Description: S3 key of the doctor-profile package (content-addressed, built by scripts/build_lambdas.py)
  PhotoUploadCodeS3Key:
    Type: String
    Description: S3 key of the photo-upload package (content-addressed, built by scripts/build_lambdas.py)
  ConsultationTypesCodeS3Key:
    Type: String
    Description: S3 key of the consultation-types package (content-addressed, built by scripts/build_lambdas.py)
  AvailabilityCodeS3Key:
    Type: String
    Description: S3 key of the availability package (content-addressed, built by scripts/build_lambdas.py)
  ScheduleCodeS3Key:
    Type: String
    Description: S3 key of the schedule package (content-addressed, built by scripts/build_lambdas.py)
  PatientProfileCodeS3Key:
    Type: String
    Description: S3 key of the patient-profile package (content-addressed, built by scripts/build_lambdas.py)
  DoctorSearchCodeS3Key:
    Type: String
    Description: S3 key of the doctor-search package (content-addressed, built by scripts/build_lambdas.py)
  SlotLookupCodeS3Key:
    Type: String
    Description: S3 key of the slot-lookup package (content-addressed, built by scripts/build_lambdas.py)
  DbMigrateCodeS3Key:
    Type: String
    Description: S3 key of the db-migrate package (content-addressed, built by scripts/build_lambdas.py)

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: CloudWatch log retention period

  # Business rules (frozen rule set). Each one reaches the functions that need it
  # as a CONFIG_* environment variable; a value changes here, never in code.
  BookingWindowDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 90
    Description: Rolling window of materialised slots, in days. Keep equal to BookingWindowDays in the jobs stack.

  MaxLookupDays:
    Type: Number
    Default: 31
    MinValue: 1
    MaxValue: 90
    Description: Longest date range one slot lookup may ask for.

  PhotoMaxUploadBytes:
    Type: Number
    Default: 5242880
    MinValue: 1024
    MaxValue: 10485760
    Description: Largest profile photo a doctor may upload, in bytes (5 MB).

  PhotoUploadUrlSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 3600
    Description: Lifetime of the pre-signed photo upload form, in seconds.

  PhotoViewUrlSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 86400
    Description: Lifetime of a pre-signed photo view link, in seconds.

  SearchDefaultPageSize:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Doctor search page size when the caller gives none.

  SearchMaxPageSize:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 100
    Description: Largest doctor search page size.

Resources:
  DoctorProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-profile
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorProfileFunction:
    Type: AWS::Lambda::Function
    DependsOn: DoctorProfileLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-profile
      Description: 'Doctor Profile: get and update the profile'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-profile-role-arn
      Timeout: 20
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DoctorProfileCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_SLOTS_BOOKING_WINDOW_DAYS: !Ref BookingWindowDays
          CONFIG_PHOTOS_VIEW_URL_SECONDS: !Ref PhotoViewUrlSeconds
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
          DOCTOR_FILES_BUCKET: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-files-bucket-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PhotoUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-photo-upload
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PhotoUploadFunction:
    Type: AWS::Lambda::Function
    DependsOn: PhotoUploadLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-photo-upload
      Description: 'Photo Upload: pre-signed S3 POST for the profile photo'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-photo-upload-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref PhotoUploadCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_PHOTOS_MAX_UPLOAD_BYTES: !Ref PhotoMaxUploadBytes
          CONFIG_PHOTOS_UPLOAD_URL_SECONDS: !Ref PhotoUploadUrlSeconds
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          DOCTOR_FILES_BUCKET: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-files-bucket-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ConsultationTypesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-consultation-types
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ConsultationTypesFunction:
    Type: AWS::Lambda::Function
    DependsOn: ConsultationTypesLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-consultation-types
      Description: 'Consultation Types: create, update, list, delete'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-consultation-types-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref ConsultationTypesCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AvailabilityLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-availability
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AvailabilityFunction:
    Type: AWS::Lambda::Function
    DependsOn: AvailabilityLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-availability
      Description: 'Availability and Blackouts: weekly patterns and blackout dates, then slot sync'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-availability-role-arn
      Timeout: 30
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref AvailabilityCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_SLOTS_BOOKING_WINDOW_DAYS: !Ref BookingWindowDays
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ScheduleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-schedule
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ScheduleFunction:
    Type: AWS::Lambda::Function
    DependsOn: ScheduleLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-schedule
      Description: 'Schedule: day and week view with booked patients'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-schedule-role-arn
      Timeout: 15
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref ScheduleCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PatientProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-patient-profile
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PatientProfileFunction:
    Type: AWS::Lambda::Function
    DependsOn: PatientProfileLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-patient-profile
      Description: 'Patient Profile: get, update, delete'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-patient-profile-role-arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref PatientProfileCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          TOKEN_REVOCATIONS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-token-revocations-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorSearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-search
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DoctorSearchFunction:
    Type: AWS::Lambda::Function
    DependsOn: DoctorSearchLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-search
      Description: 'Doctor Search: filtered search and public profile'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-search-role-arn
      Timeout: 15
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DoctorSearchCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_PHOTOS_VIEW_URL_SECONDS: !Ref PhotoViewUrlSeconds
          CONFIG_SEARCH_DEFAULT_PAGE_SIZE: !Ref SearchDefaultPageSize
          CONFIG_SEARCH_MAX_PAGE_SIZE: !Ref SearchMaxPageSize
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          DOCTOR_FILES_BUCKET: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-files-bucket-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SlotLookupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-slot-lookup
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SlotLookupFunction:
    Type: AWS::Lambda::Function
    DependsOn: SlotLookupLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-slot-lookup
      Description: 'Slot Lookup: open slots with free seats'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-slot-lookup-role-arn
      Timeout: 15
      MemorySize: 512
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref SlotLookupCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          CONFIG_SLOTS_MAX_LOOKUP_DAYS: !Ref MaxLookupDays
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
          SLOTS_TABLE: !ImportValue
            Fn::Sub: medislot-${Environment}-doctor-slots-table-name
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DbMigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-db-migrate
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  DbMigrateFunction:
    Type: AWS::Lambda::Function
    DependsOn: DbMigrateLogGroup
    Properties:
      FunctionName: !Sub medislot-${Environment}-db-migrate
      Description: 'Schema migrations and RDS connectivity check (invoked by the pipeline)'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !ImportValue
        Fn::Sub: medislot-${Environment}-db-migrate-role-arn
      Timeout: 120
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref DbMigrateCodeS3Key
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az1-id
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-subnet-az2-id
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: medislot-${Environment}-lambda-sg-id
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_HOST: !ImportValue
            Fn::Sub: medislot-${Environment}-db-endpoint
          DB_PORT: !ImportValue
            Fn::Sub: medislot-${Environment}-db-port
          DB_NAME: !ImportValue
            Fn::Sub: medislot-${Environment}-db-name
          DB_USERNAME_PARAMETER: !Sub /medislot/${Environment}/db/username
          DB_PASSWORD_PARAMETER: !Sub /medislot/${Environment}/db/password
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DoctorProfileFunctionArn:
    Value: !GetAtt DoctorProfileFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-doctor-profile-function-arn
  DoctorProfileFunctionName:
    Value: !Ref DoctorProfileFunction
    Export:
      Name: !Sub medislot-${Environment}-doctor-profile-function-name
  PhotoUploadFunctionArn:
    Value: !GetAtt PhotoUploadFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-photo-upload-function-arn
  PhotoUploadFunctionName:
    Value: !Ref PhotoUploadFunction
    Export:
      Name: !Sub medislot-${Environment}-photo-upload-function-name
  ConsultationTypesFunctionArn:
    Value: !GetAtt ConsultationTypesFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-consultation-types-function-arn
  ConsultationTypesFunctionName:
    Value: !Ref ConsultationTypesFunction
    Export:
      Name: !Sub medislot-${Environment}-consultation-types-function-name
  AvailabilityFunctionArn:
    Value: !GetAtt AvailabilityFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-availability-function-arn
  AvailabilityFunctionName:
    Value: !Ref AvailabilityFunction
    Export:
      Name: !Sub medislot-${Environment}-availability-function-name
  ScheduleFunctionArn:
    Value: !GetAtt ScheduleFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-schedule-function-arn
  ScheduleFunctionName:
    Value: !Ref ScheduleFunction
    Export:
      Name: !Sub medislot-${Environment}-schedule-function-name
  PatientProfileFunctionArn:
    Value: !GetAtt PatientProfileFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-patient-profile-function-arn
  PatientProfileFunctionName:
    Value: !Ref PatientProfileFunction
    Export:
      Name: !Sub medislot-${Environment}-patient-profile-function-name
  DoctorSearchFunctionArn:
    Value: !GetAtt DoctorSearchFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-doctor-search-function-arn
  DoctorSearchFunctionName:
    Value: !Ref DoctorSearchFunction
    Export:
      Name: !Sub medislot-${Environment}-doctor-search-function-name
  SlotLookupFunctionArn:
    Value: !GetAtt SlotLookupFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-slot-lookup-function-arn
  SlotLookupFunctionName:
    Value: !Ref SlotLookupFunction
    Export:
      Name: !Sub medislot-${Environment}-slot-lookup-function-name
  DbMigrateFunctionArn:
    Value: !GetAtt DbMigrateFunction.Arn
    Export:
      Name: !Sub medislot-${Environment}-db-migrate-function-arn
  DbMigrateFunctionName:
    Value: !Ref DbMigrateFunction
    Export:
      Name: !Sub medislot-${Environment}-db-migrate-function-name
