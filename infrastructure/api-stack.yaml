AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot shared HTTP API. Owns the API Gateway, authentication routes, CORS and default stage; application routes are added by app-stack.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - prod

  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Comma-separated browser origins allowed to call the API, for example
      https://app.example.com. Leave empty if no browser calls the API directly.
      When set, API Gateway answers CORS preflight (OPTIONS) requests itself;
      without it an OPTIONS request finds no matching route and gets a 404.

  ThrottleRateLimit:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Steady-state requests per second allowed on every route.

  ThrottleBurstLimit:
    Type: Number
    Default: 200
    MinValue: 1
    Description: Burst requests allowed on every route.

  AuthThrottleRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >-
      Requests per second allowed on register and login. These are public and
      run bcrypt, so they are capped lower to limit brute-force and cost abuse.

  AuthThrottleBurstLimit:
    Type: Number
    Default: 40
    MinValue: 1
    Description: Burst requests allowed on register and login.

Conditions:
  HasCorsOrigins: !Not
    - !Equals
      - !Join ['', !Ref CorsAllowedOrigins]
      - ''

Resources:
  AuthHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub medislot-${Environment}-api
      Description: MediSlot shared doctor and patient API
      ProtocolType: HTTP
      CorsConfiguration: !If
        - HasCorsOrigins
        - AllowOrigins: !Ref CorsAllowedOrigins
          AllowMethods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          AllowHeaders:
            - Authorization
            - Content-Type
          MaxAge: 3600
        - !Ref AWS::NoValue
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  AuthApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuthHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-auth-function-arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  DoctorRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/doctors/register'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  DoctorLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/doctors/login'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  PatientRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/patients/register'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  PatientLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/patients/login'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  RefreshRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/refresh'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  # Logout is authenticated by the refresh token itself, sent in the JSON body
  # or as the Bearer value. An access token is optional, so no authorizer here.
  LogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/logout'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  # Allow API Gateway to invoke the authentication Lambda integration.
  AuthApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-auth-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*
        - ApiId: !Ref AuthHttpApi

  AuthApiStage:
    Type: AWS::ApiGatewayV2::Stage
    # Route settings can only be applied once their routes exist.
    DependsOn:
      - DoctorRegisterRoute
      - DoctorLoginRoute
      - PatientRegisterRoute
      - PatientLoginRoute
      - RefreshRoute
      - LogoutRoute
    Properties:
      ApiId: !Ref AuthHttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit
      RouteSettings:
        'POST /auth/doctors/register':
          ThrottlingRateLimit: !Ref AuthThrottleRateLimit
          ThrottlingBurstLimit: !Ref AuthThrottleBurstLimit
        'POST /auth/doctors/login':
          ThrottlingRateLimit: !Ref AuthThrottleRateLimit
          ThrottlingBurstLimit: !Ref AuthThrottleBurstLimit
        'POST /auth/patients/register':
          ThrottlingRateLimit: !Ref AuthThrottleRateLimit
          ThrottlingBurstLimit: !Ref AuthThrottleBurstLimit
        'POST /auth/patients/login':
          ThrottlingRateLimit: !Ref AuthThrottleRateLimit
          ThrottlingBurstLimit: !Ref AuthThrottleBurstLimit
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

Outputs:
  ApiUrl:
    Description: Base URL for the shared MediSlot API
    Value: !GetAtt AuthHttpApi.ApiEndpoint
    Export:
      Name: !Sub medislot-${Environment}-api-url

  ApiId:
    Description: Shared API Gateway ID
    Value: !Ref AuthHttpApi
    Export:
      Name: !Sub medislot-${Environment}-api-id