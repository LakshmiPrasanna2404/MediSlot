AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot HTTP API Gateway for doctor and patient authentication endpoints.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - prod

Resources:
  AuthHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub medislot-${Environment}-auth-api
      Description: MediSlot authentication API
      ProtocolType: HTTP
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  AuthApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AuthHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-auth-function-arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  # Existing JWT authorizer Lambda. Public registration, login, and refresh
  # routes do not use this authorizer; logout does.
  AuthJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref AuthHttpApi
      Name: !Sub medislot-${Environment}-jwt-authorizer
      AuthorizerType: REQUEST
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: medislot-${Environment}-authorizer-function-arn
      IdentitySource:
        - $request.header.Authorization
      AuthorizerPayloadFormatVersion: '1.0'
      EnableSimpleResponses: false
      AuthorizerResultTtlInSeconds: 0

  DoctorRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/doctors/register'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  DoctorLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/doctors/login'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  PatientRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/patients/register'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  PatientLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/patients/login'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  RefreshRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/refresh'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  LogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AuthHttpApi
      RouteKey: 'POST /auth/logout'
      Target: !Sub integrations/${AuthApiIntegration}
      AuthorizationType: NONE

  # Allow API Gateway to invoke the authentication Lambda integration.
  AuthApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-auth-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/*
        - ApiId: !Ref AuthHttpApi

  # Allow API Gateway to invoke the existing JWT authorizer Lambda.
  AuthAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-authorizer-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/authorizers/${AuthorizerId}
        - ApiId: !Ref AuthHttpApi
          AuthorizerId: !Ref AuthJwtAuthorizer

  AuthApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AuthHttpApi
      StageName: '$default'
      AutoDeploy: true
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

Outputs:
  AuthApiUrl:
    Description: Base URL for authentication requests
    Value: !GetAtt AuthHttpApi.ApiEndpoint
    Export:
      Name: !Sub medislot-${Environment}-auth-api-url

  AuthApiId:
    Description: Authentication API Gateway ID
    Value: !Ref AuthHttpApi
    Export:
      Name: !Sub medislot-${Environment}-auth-api-id
