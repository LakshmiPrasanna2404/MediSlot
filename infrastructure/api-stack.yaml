AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot HTTP API (API Gateway). Public routes: register, login, refresh.
  Every other route goes through the JWT Lambda authorizer (REQUEST type,
  simple responses, cache TTL 0), which refuses missing, bad, expired or
  inactive tokens with 401 and the wrong role with 403. Request bodies are
  checked against JSON schemas inside the Lambdas (HTTP APIs have no request
  validation). The stage deploys every change on its own (AutoDeploy).

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment; also the stage name

  DefaultRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second on every route

  DefaultBurstLimit:
    Type: Number
    Default: 100
    Description: Burst requests on every route

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: Access log retention

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub medislot-${Environment}-api
      Description: MediSlot doctor and patient API
      ProtocolType: HTTP
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  # Lambda authorizer. No identity source: the function sees every request and
  # answers a missing, bad, expired or inactive token with 401 itself (AWS only
  # passes a function's "Unauthorized" through as 401 when the authorizer has
  # no identity source). isAuthorized false gives 403. Cache TTL 0: with
  # caching, a token used after logout would still be accepted until the cache
  # entry expired.
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: jwt-authorizer
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn: !ImportValue
            Fn::Sub: medislot-${Environment}-authorizer-function-arn
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true
      AuthorizerResultTtlInSeconds: 0

  # ---------------------------------------------------------------------------
  # Integrations: one per Lambda function (Lambda proxy, payload format 2.0)
  # ---------------------------------------------------------------------------
  AuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Auth Lambda (register, login, refresh, logout)
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-auth-function-arn
      PayloadFormatVersion: '2.0'

  DoctorProfileIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Doctor Profile Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-profile-function-arn
      PayloadFormatVersion: '2.0'

  PhotoUploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Photo Upload Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-photo-upload-function-arn
      PayloadFormatVersion: '2.0'

  ConsultationTypesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Consultation Types Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-consultation-types-function-arn
      PayloadFormatVersion: '2.0'

  AvailabilityIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Availability Lambda (weekly hours and blackout dates)
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-availability-function-arn
      PayloadFormatVersion: '2.0'

  ScheduleIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Schedule Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-schedule-function-arn
      PayloadFormatVersion: '2.0'

  PatientProfileIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Patient Profile Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-patient-profile-function-arn
      PayloadFormatVersion: '2.0'

  DoctorSearchIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Doctor Search Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-search-function-arn
      PayloadFormatVersion: '2.0'

  SlotLookupIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Slot Lookup Lambda
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue
        Fn::Sub: medislot-${Environment}-slot-lookup-function-arn
      PayloadFormatVersion: '2.0'

  # ---------------------------------------------------------------------------
  # Routes. NONE: public. CUSTOM: through the JWT Lambda authorizer.
  # ---------------------------------------------------------------------------
  # Register a doctor
  DoctorRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/doctors/register'
      AuthorizationType: NONE
      Target: !Sub integrations/${AuthIntegration}

  # Register a patient
  PatientRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/patients/register'
      AuthorizationType: NONE
      Target: !Sub integrations/${AuthIntegration}

  # Doctor login
  DoctorLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/doctors/login'
      AuthorizationType: NONE
      Target: !Sub integrations/${AuthIntegration}

  # Patient login
  PatientLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/patients/login'
      AuthorizationType: NONE
      Target: !Sub integrations/${AuthIntegration}

  # Rotate the refresh token, new access token
  RefreshRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/refresh'
      AuthorizationType: NONE
      Target: !Sub integrations/${AuthIntegration}

  # Revoke the refresh token and the access token
  LogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /auth/logout'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AuthIntegration}

  # The calling doctor's profile
  GetDoctorProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/me'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${DoctorProfileIntegration}

  # Update the calling doctor's profile
  UpdateDoctorProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /doctors/me'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${DoctorProfileIntegration}

  # Pre-signed S3 POST for a profile photo
  PhotoUploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /doctors/me/photo'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${PhotoUploadIntegration}

  # List consultation types
  ListConsultationTypesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/me/consultation-types'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ConsultationTypesIntegration}

  # Create a consultation type
  CreateConsultationTypeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /doctors/me/consultation-types'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ConsultationTypesIntegration}

  # Update a consultation type
  UpdateConsultationTypeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /doctors/me/consultation-types/{consultationTypeId}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ConsultationTypesIntegration}

  # Deactivate a consultation type
  DeleteConsultationTypeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /doctors/me/consultation-types/{consultationTypeId}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ConsultationTypesIntegration}

  # Weekly availability patterns
  GetAvailabilityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/me/availability'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AvailabilityIntegration}

  # Replace the weekly availability patterns
  ReplaceAvailabilityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /doctors/me/availability'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AvailabilityIntegration}

  # List blackout dates
  ListBlackoutsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/me/blackouts'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AvailabilityIntegration}

  # Add a blackout date
  AddBlackoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /doctors/me/blackouts'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AvailabilityIntegration}

  # Remove a blackout date
  RemoveBlackoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /doctors/me/blackouts/{blackoutId}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AvailabilityIntegration}

  # Day or week view with booked patients
  ScheduleRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/me/schedule'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ScheduleIntegration}

  # The doctor's appointments in a date range
  DoctorAppointmentsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/me/appointments'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ScheduleIntegration}

  # The calling patient's profile
  GetPatientProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /patients/me'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${PatientProfileIntegration}

  # Update the calling patient's profile
  UpdatePatientProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /patients/me'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${PatientProfileIntegration}

  # Delete or deactivate the calling patient's account
  DeletePatientAccountRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /patients/me'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${PatientProfileIntegration}

  # Search doctors by name, hospital, specialisation, city
  SearchDoctorsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${DoctorSearchIntegration}

  # Public doctor profile with consultation types and fees
  GetDoctorRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/{doctorId}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${DoctorSearchIntegration}

  # Open slots with free seats
  DoctorSlotsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /doctors/{doctorId}/slots'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${SlotLookupIntegration}

  # ---------------------------------------------------------------------------
  # Stage and access logs
  # ---------------------------------------------------------------------------
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/medislot-${Environment}-api-access
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # AutoDeploy: every change to a route or integration is live as soon as the
  # stack update finishes; no deployment resource is needed.
  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - DoctorRegisterRoute
      - PatientRegisterRoute
      - DoctorLoginRoute
      - PatientLoginRoute
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Environment
      Description: MediSlot API stage
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","route":"$context.routeKey","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency","userId":"$context.authorizer.userId","role":"$context.authorizer.role","authorizerError":"$context.authorizer.error","error":"$context.error.message","integrationError":"$context.integrationErrorMessage"}'
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref DefaultRateLimit
        ThrottlingBurstLimit: !Ref DefaultBurstLimit
        DetailedMetricsEnabled: false
      # Register and login are public and run bcrypt, so they are capped lower
      # against brute force and cost abuse: 10 requests per second, burst 20.
      RouteSettings:
        'POST /auth/doctors/register':
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        'POST /auth/patients/register':
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        'POST /auth/doctors/login':
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        'POST /auth/patients/login':
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # Permission for API Gateway to invoke each function
  # ---------------------------------------------------------------------------
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-authorizer-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/*

  AuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-auth-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  DoctorProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-profile-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  PhotoUploadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-photo-upload-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ConsultationTypesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-consultation-types-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  AvailabilityInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-availability-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-schedule-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  PatientProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-patient-profile-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  DoctorSearchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-doctor-search-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  SlotLookupInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue
        Fn::Sub: medislot-${Environment}-slot-lookup-function-arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ApiUrl:
    Description: Base URL of the MediSlot HTTP API (stage included)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub medislot-${Environment}-api-url

  ApiId:
    Description: API id (the ApiId dimension of AWS/ApiGateway metrics)
    Value: !Ref HttpApi
    Export:
      Name: !Sub medislot-${Environment}-api-id

  ApiName:
    Value: !Sub medislot-${Environment}-api
