---
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot event bus (Milestone 5). The custom EventBridge bus that Booking,
  Cancel, Outcome and Slot Cancel publish their domain events to. Nothing
  consumes the events yet; the consumers arrive in Milestone 6.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

Resources:
  # Every MediSlot domain event: source "medislot", detail-type = event type,
  # detail = {eventId, eventType, occurredAt, correlationId, detail}.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub medislot-${Environment}-events
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

Outputs:
  EventBusName:
    Value: !Ref EventBus
    Export:
      Name: !Sub medislot-${Environment}-event-bus-name
  EventBusArn:
    Value: !GetAtt EventBus.Arn
    Export:
      Name: !Sub medislot-${Environment}-event-bus-arn
