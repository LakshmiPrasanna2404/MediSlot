AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot monitoring. An SNS topic for alarm notifications and the CloudWatch
  alarms for API errors, database CPU, Lambda errors and DynamoDB conditional-check
  failures. Saga and asynchronous-delivery alarms are added when those resources exist.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment.
    AllowedValues:
      - dev
      - prod

  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Email address that receives alarm notifications. Leave empty to create the
      topic without a subscriber. AWS sends a confirmation email that must be accepted.

  Api5xxThreshold:
    Type: Number
    Default: 5
    MinValue: 1
    Description: API Gateway 5xx responses in 5 minutes that raise the alarm.

  RdsCpuThreshold:
    Type: Number
    Default: 70
    MinValue: 1
    MaxValue: 100
    Description: Average database CPU percent over 10 minutes that raises the alarm.

  LambdaErrorThreshold:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Auth or app Lambda errors in 5 minutes that raise the alarm.

  ConditionalCheckFailureThreshold:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Slots-table conditional-check failures in 5 minutes that raise the alarm.

Conditions:
  HasAlarmEmail: !Not
    - !Equals
      - !Ref AlarmEmail
      - ''

Resources:
  # Not encrypted on purpose: CloudWatch alarms cannot publish to a topic that is
  # encrypted with an AWS managed key. The messages hold alarm names and states only.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub medislot-${Environment}-alarms
      DisplayName: !Sub MediSlot ${Environment} alarms
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMediSlotAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:medislot-${Environment}-*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${Environment}-api-5xx
      AlarmDescription: The API returned server errors. Check the Lambda logs.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-api-id
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref Api5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${Environment}-rds-cpu
      AlarmDescription: Database CPU is high.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-db-instance-id
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref RdsCpuThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # The authorizer is not alarmed: it raises "Unauthorized" for every rejected
  # token, so its Errors metric counts normal 401 responses.
  AuthLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${Environment}-lambda-auth-errors
      AlarmDescription: The auth Lambda is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub medislot-${Environment}-auth
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AppLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${Environment}-lambda-app-errors
      AlarmDescription: The app Lambda is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub medislot-${Environment}-app
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  SlotsConditionalCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub medislot-${Environment}-ddb-slots-conditional-check
      AlarmDescription: Many booking attempts are losing races on the slots table.
      Namespace: AWS/DynamoDB
      MetricName: ConditionalCheckFailedRequests
      Dimensions:
        - Name: TableName
          Value:
            Fn::ImportValue:
              Fn::Sub: medislot-${Environment}-slots-table-name
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ConditionalCheckFailureThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

Outputs:
  AlarmTopicArn:
    Description: SNS topic that receives alarm notifications.
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub medislot-${Environment}-alarm-topic-arn
