    Description: Service role for every stack after network, data and iam (read by the pipeline)
    Value: !GetAtt CloudFormationExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-cloudformation-execution-role-arn
  AppLambdaRoleArn:
    Description: LEGACY export, removed with AppLambdaRole
    Value: !GetAtt AppLambdaRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-app-role-arn
