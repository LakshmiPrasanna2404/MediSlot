AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot IAM. One execution role per Lambda function (every function in the
  architecture diagrams, including the ones planned for Milestones 5 and 6),
  the EventBridge Scheduler invoke role, the API Gateway logging role and the
  web instance role. No wildcard actions; resources are named ARNs. Only the
  ENI actions use Resource "*", because AWS does not support resource-level
  permissions for them.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

Resources:
  # ---------------------------------------------------------------------------
  # Shared policies
  # ---------------------------------------------------------------------------
  LambdaBasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: 'The ENI actions Lambda needs to join the VPC do not support resource-level permissions, so Resource is * for that statement only.'
    Properties:
      ManagedPolicyName: !Sub medislot-${Environment}-lambda-base
      Description: Logs, VPC networking and the business-rule parameters, for every MediSlot Lambda
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*:*
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Sid: ReadBusinessRules
            Effect: Allow
            Action:
              - ssm:GetParametersByPath
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/config
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/config/*

  DatabaseAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub medislot-${Environment}-database-access
      Description: Read the RDS username and password (SecureString) from SSM
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadDatabaseCredentials
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*

  # M2 - Lambda authorizer: verify JWT, check denylist
  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-authorizer-role
      Description: 'Lambda authorizer: verify JWT, check denylist'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
      Policies:
        - PolicyName: authorizer-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAuthParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*
              - Sid: ReadDenylist
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations

  # M2 - Auth Lambda: register, login, refresh, logout
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-auth-role
      Description: 'Auth Lambda: register, login, refresh, logout'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: auth-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAuthParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*
              - Sid: RefreshTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-refresh-tokens
              - Sid: Denylist
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations

  # M3 - Doctor Profile Lambda
  DoctorProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-doctor-profile-role
      Description: 'Doctor Profile Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: doctor-profile-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SyncSlotsOnTimezoneChange
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots/index/*
              - Sid: SignPhotoDownloads
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/doctor-profiles/*

  # M3 - Photo Upload Lambda: pre-signed POST
  PhotoUploadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-photo-upload-role
      Description: 'Photo Upload Lambda: pre-signed POST'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: photo-upload-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SignPhotoUploads
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/doctor-profiles/*

  # M3 - Consultation Types Lambda
  ConsultationTypesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-consultation-types-role
      Description: 'Consultation Types Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy

  # M3 - Availability and Blackouts Lambda
  AvailabilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-availability-role
      Description: 'Availability and Blackouts Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: availability-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SyncSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots/index/*

  # M3 - Schedule Lambda: day and week view
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-schedule-role
      Description: 'Schedule Lambda: day and week view'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: schedule-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots/index/*

  # M3 - Slot Materialiser (daily job)
  SlotMaterialiserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-slot-materialiser-role
      Description: 'Slot Materialiser (daily job)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: slot-materialiser-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MaterialiseSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots/index/*

  # M4 - Patient Profile Lambda
  PatientProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-patient-profile-role
      Description: 'Patient Profile Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: patient-profile-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RevokeTokenOnDelete
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations

  # M4 - Doctor Search Lambda
  DoctorSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-doctor-search-role
      Description: 'Doctor Search Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: doctor-search-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SignPhotoDownloads
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/doctor-profiles/*

  # M4 - Slot Lookup Lambda
  SlotLookupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-slot-lookup-role
      Description: 'Slot Lookup Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: slot-lookup-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots/index/*

  # M2 - Schema migrations, run by the pipeline inside the VPC
  DbMigrateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-db-migrate-role
      Description: 'Schema migrations, run by the pipeline inside the VPC'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy

  # M5 - Booking Lambda (planned)
  BookingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-booking-role
      Description: 'Booking Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: booking-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ClaimSeat
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
              - Sid: SeatItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats
              - Sid: Idempotency
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-idempotency
              - Sid: ExpiredOffers
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events
              - Sid: ReminderSchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*
              - Sid: PassSchedulerRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt SchedulerInvokeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # M5 - Cancel and refund Lambda (planned)
  CancelRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-cancel-role
      Description: 'Cancel and refund Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: cancel-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReleaseSeat
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
              - Sid: SeatItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events
              - Sid: ReminderSchedules
                Effect: Allow
                Action:
                  - scheduler:DeleteSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*

  # M5 - Refund History Lambda (planned)
  RefundHistoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-refund-history-role
      Description: 'Refund History Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy

  # M5 - Outcome Lambda: COMPLETED or NO_SHOW (planned)
  OutcomeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-outcome-role
      Description: 'Outcome Lambda: COMPLETED or NO_SHOW (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: outcome-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # M5 - Slot Cancel Lambda: starts the slot-cancel workflow (planned)
  SlotCancelRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-slot-cancel-role
      Description: 'Slot Cancel Lambda: starts the slot-cancel workflow (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: slot-cancel-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloseSlot
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
              - Sid: StartWorkflow
                Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-slot-cancel

  # M6 - Reschedule Starter Lambda (planned)
  RescheduleStarterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-reschedule-starter-role
      Description: 'Reschedule Starter Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: reschedule-starter-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartSaga
                Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-reschedule

  # M6 - Waitlist Lambda: join, leave, list, accept (planned)
  WaitlistRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-waitlist-role
      Description: 'Waitlist Lambda: join, leave, list, accept (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: waitlist-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WaitlistEntries
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist/index/*
              - Sid: QueueCounter
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
              - Sid: Offers
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers/index/*
              - Sid: SeatItems
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # M6 - Waitlist Processor: SlotSeatFreed -> hold offer (planned)
  WaitlistProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-waitlist-processor-role
      Description: 'Waitlist Processor: SlotSeatFreed -> hold offer (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
      Policies:
        - PolicyName: waitlist-processor-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: HoldSeat
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
              - Sid: NextInLine
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist/index/*
              - Sid: CreateOffer
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers/index/*
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events
              - Sid: ExpirySchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*
              - Sid: PassSchedulerRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt SchedulerInvokeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # M6 - Notification Lambda: exactly-once SNS dispatch (planned)
  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-notification-role
      Description: 'Notification Lambda: exactly-once SNS dispatch (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: notification-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DispatchLog
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-dispatch-log
              - Sid: Publish
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*

  # M6 - Offer Expiry job (planned)
  OfferExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-offer-expiry-role
      Description: 'Offer Expiry job (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
      Policies:
        - PolicyName: offer-expiry-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExpireOffer
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers/index/*
              - Sid: ReleaseHeldSeat
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-slots
              - Sid: RemoveEntry
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # M6 - Reminder job (planned)
  ReminderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-reminder-role
      Description: 'Reminder job (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: reminder-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DispatchLog
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-dispatch-log
              - Sid: Publish
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*

  # M6 - No-show job (planned)
  NoShowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-no-show-role
      Description: 'No-show job (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: no-show-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # ---------------------------------------------------------------------------
  # Service roles
  # ---------------------------------------------------------------------------
  # EventBridge Scheduler invokes the scheduled-job Lambdas with this role.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-scheduler-invoke-role
      Description: EventBridge Scheduler invokes the MediSlot job Lambdas
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-job-functions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeJobs
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-slot-materialiser
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-offer-expiry
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-reminder
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-no-show

  # API Gateway writes REST API access logs to CloudWatch with this role.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-apigateway-logs-role
      Description: API Gateway pushes access logs to CloudWatch Logs
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # The Flask web app on EC2 is a pure API client: it reads its own settings
  # and its package, and has no database credentials or data-table access.
  DashboardEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-dashboard-role
      Description: Instance role for the MediSlot web app (doctor and patient dashboards)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Session Manager instead of SSH: no port 22, no key pairs, every session
      # is logged by IAM identity. Used to read the web app's journal.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: web-app-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWebSettings
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/dashboard/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/api/*
              - Sid: ReadWebPackage
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}/medislot/${Environment}/dashboard/*
                  - Bucket: !ImportValue medislot-artifacts-bucket-name

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub medislot-${Environment}-dashboard-profile
      Roles:
        - !Ref DashboardEC2Role

  # LEGACY: the single "app" Lambda role from before the per-function split.
  # The old app stack imports its export, so it stays until that stack has
  # been updated once; remove it in the next pull request.
  AppLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-app-role
      Description: LEGACY - replaced by the per-function roles above
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy

