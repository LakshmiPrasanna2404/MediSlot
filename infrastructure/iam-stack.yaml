AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MediSlot IAM. One execution role per Lambda function (every function in the
  architecture diagrams, including the ones planned for Milestones 5 and 6),
  the EventBridge Scheduler invoke role, the API Gateway logging role, the web
  instance role, and the CloudFormation execution role that deploys every stack
  after network, data and iam. Resources are named ARNs wherever the service
  supports it.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

Resources:
  # ---------------------------------------------------------------------------
  # Shared policies
  # ---------------------------------------------------------------------------
  LambdaBasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: 'The ENI actions Lambda needs to join the VPC do not support resource-level permissions, so Resource is * for that statement only.'
    Properties:
      ManagedPolicyName: !Sub medislot-${Environment}-lambda-base
      Description: Logs, VPC networking and the business-rule parameters, for every MediSlot Lambda
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*:*
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'

  DatabaseAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub medislot-${Environment}-database-access
      Description: Read the RDS username and password (SecureString) from SSM
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadDatabaseCredentials
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*

  # M2 - Lambda authorizer: verify JWT, check denylist
  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-authorizer-role
      Description: 'Lambda authorizer: verify JWT, check denylist'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
      Policies:
        - PolicyName: authorizer-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAuthParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*
              - Sid: ReadDenylist
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations

  # M2 - Auth Lambda: register, login, refresh, logout
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-auth-role
      Description: 'Auth Lambda: register, login, refresh, logout'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: auth-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAuthParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*
              - Sid: RefreshTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-refresh-tokens
              - Sid: Denylist
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations

  # M3 - Doctor Profile Lambda
  DoctorProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-doctor-profile-role
      Description: 'Doctor Profile Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: doctor-profile-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SyncSlotsOnTimezoneChange
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: SignPhotoDownloads
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/doctor-profiles/*

  # M3 - Photo Upload Lambda: pre-signed POST
  PhotoUploadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-photo-upload-role
      Description: 'Photo Upload Lambda: pre-signed POST'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: photo-upload-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SignPhotoUploads
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/doctor-profiles/*

  # M3 - Consultation Types Lambda
  ConsultationTypesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-consultation-types-role
      Description: 'Consultation Types Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy

  # M3 - Availability and Blackouts Lambda
  AvailabilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-availability-role
      Description: 'Availability and Blackouts Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: availability-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SyncSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots

  # M3 - Schedule Lambda: day and week view
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-schedule-role
      Description: 'Schedule Lambda: day and week view'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: schedule-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots

  # M3 - Slot Materialiser (daily job)
  SlotMaterialiserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-slot-materialiser-role
      Description: 'Slot Materialiser (daily job)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: slot-materialiser-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MaterialiseSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots

  # M4 - Patient Profile Lambda
  PatientProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-patient-profile-role
      Description: 'Patient Profile Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: patient-profile-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RevokeTokenOnDelete
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-token-revocations

  # M4 - Doctor Search Lambda
  DoctorSearchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-doctor-search-role
      Description: 'Doctor Search Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: doctor-search-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SignPhotoDownloads
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-${AWS::AccountId}-${AWS::Region}-doctor-profile-files/doctor-profiles/*

  # M4 - Slot Lookup Lambda
  SlotLookupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-slot-lookup-role
      Description: 'Slot Lookup Lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: slot-lookup-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSlots
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots

  # M2 - Schema migrations, run by the pipeline inside the VPC
  DbMigrateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-db-migrate-role
      Description: 'Schema migrations, run by the pipeline inside the VPC'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy

  # M5 - Booking Lambda (planned)
  BookingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-booking-role
      Description: 'Booking Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: booking-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ClaimSeat
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: SeatItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats
              - Sid: Idempotency
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-idempotency
              - Sid: ExpiredOffers
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events
              - Sid: ReminderSchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*
              - Sid: PassSchedulerRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt SchedulerInvokeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # M5 - Cancel and refund Lambda (planned)
  CancelRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-cancel-role
      Description: 'Cancel and refund Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: cancel-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReleaseSeat
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: SeatItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events
              - Sid: ReminderSchedules
                Effect: Allow
                Action:
                  - scheduler:DeleteSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*

  # M5 - Refund History Lambda (planned)
  RefundHistoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-refund-history-role
      Description: 'Refund History Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy

  # M5 - Outcome Lambda: COMPLETED or NO_SHOW (planned)
  OutcomeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-outcome-role
      Description: 'Outcome Lambda: COMPLETED or NO_SHOW (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: outcome-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # M5 - Slot Cancel Lambda: starts the slot-cancel workflow (planned)
  SlotCancelRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-slot-cancel-role
      Description: 'Slot Cancel Lambda: starts the slot-cancel workflow (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: slot-cancel-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloseSlot
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: StartWorkflow
                Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-slot-cancel

  # M6 - Reschedule Starter Lambda (planned)
  RescheduleStarterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-reschedule-starter-role
      Description: 'Reschedule Starter Lambda (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: reschedule-starter-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartSaga
                Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-reschedule

  # M6 - Waitlist Lambda: join, leave, list, accept (planned)
  WaitlistRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-waitlist-role
      Description: 'Waitlist Lambda: join, leave, list, accept (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: waitlist-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WaitlistEntries
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist/index/*
              - Sid: QueueCounter
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: Offers
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers/index/*
              - Sid: SeatItems
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-seats
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # M6 - Waitlist Processor: SlotSeatFreed -> hold offer (planned)
  WaitlistProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-waitlist-processor-role
      Description: 'Waitlist Processor: SlotSeatFreed -> hold offer (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
      Policies:
        - PolicyName: waitlist-processor-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: HoldSeat
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: NextInLine
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist/index/*
              - Sid: CreateOffer
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers/index/*
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events
              - Sid: ExpirySchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*
              - Sid: PassSchedulerRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt SchedulerInvokeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # M6 - Notification Lambda: exactly-once SNS dispatch (planned)
  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-notification-role
      Description: 'Notification Lambda: exactly-once SNS dispatch (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: notification-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DispatchLog
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-dispatch-log
              - Sid: Publish
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*

  # M6 - Offer Expiry job (planned)
  OfferExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-offer-expiry-role
      Description: 'Offer Expiry job (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
      Policies:
        - PolicyName: offer-expiry-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExpireOffer
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-hold-offers/index/*
              - Sid: ReleaseHeldSeat
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-doctor-slots
              - Sid: RemoveEntry
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-waitlist
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # M6 - Reminder job (planned)
  ReminderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-reminder-role
      Description: 'Reminder job (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: reminder-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DispatchLog
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-dispatch-log
              - Sid: Publish
                Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*

  # M6 - No-show job (planned)
  NoShowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-no-show-role
      Description: 'No-show job (planned)'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy
        - !Ref DatabaseAccessPolicy
      Policies:
        - PolicyName: no-show-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishEvents
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-events

  # ---------------------------------------------------------------------------
  # Service roles
  # ---------------------------------------------------------------------------
  # EventBridge Scheduler invokes the scheduled-job Lambdas with this role.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-scheduler-invoke-role
      Description: EventBridge Scheduler invokes the MediSlot job Lambdas
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-job-functions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeJobs
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-slot-materialiser
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-offer-expiry
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-reminder
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-no-show

  # API Gateway writes REST API access logs to CloudWatch with this role.
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-apigateway-logs-role
      Description: API Gateway pushes access logs to CloudWatch Logs
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # The Flask web app on EC2 is a pure API client: it reads its own settings
  # and its package, and has no database credentials or data-table access.
  DashboardEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-dashboard-role
      Description: Instance role for the MediSlot web app (doctor and patient dashboards)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Session Manager instead of SSH: no port 22, no key pairs, every session
      # is logged by IAM identity. The web app's own logs go to CloudWatch Logs.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: web-app-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWebPackage
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub
                  - ${BucketArn}/medislot/${Environment}/dashboard/*
                  - BucketArn:
                      Fn::ImportValue: !Sub medislot-${Environment}-artifact-bucket-arn
              # The CloudWatch agent on the instance ships the app log and the
              # boot log to this one log group (created by the dashboard stack).
              - Sid: ShipWebLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/medislot/${Environment}/web
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/medislot/${Environment}/web:*

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub medislot-${Environment}-dashboard-profile
      Roles:
        - !Ref DashboardEC2Role

  # LEGACY: the single "app" Lambda role from before the per-function split.
  # The old app stack imports its export, so it stays until that stack has
  # been updated once; remove it in the next pull request.
  AppLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-app-role
      Description: LEGACY - replaced by the per-function roles above
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaBasePolicy

  # ---------------------------------------------------------------------------
  # CloudFormation execution role. The pipeline deploys network, data and iam
  # with its own role, and every other stack through this one (it is the
  # service role those stacks were created with). Write actions are listed by
  # name; read-only actions use Describe*/Get*/List* so CloudFormation's
  # resource handlers can read what they manage.
  # ---------------------------------------------------------------------------
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: 'EC2 instance, address and security group writes cannot be scoped to a resource name before the resource exists; they are limited to this region.'
    Properties:
      RoleName: !Sub medislot-${Environment}-cloudformation-execution-role
      Description: Service role CloudFormation uses for the MediSlot config, auth, app, jobs, monitoring, dashboard and api stacks
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediSlotStackDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaFunctions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:PutFunctionEventInvokeConfig
                  - lambda:UpdateFunctionEventInvokeConfig
                  - lambda:DeleteFunctionEventInvokeConfig
                  - lambda:Get*
                  - lambda:List*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-*
              - Sid: ReadLambdaPackages
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub
                  - ${BucketArn}/medislot/${Environment}/*
                  - BucketArn:
                      Fn::ImportValue: !Sub medislot-${Environment}-artifact-bucket-arn
              - Sid: PassMediSlotRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/medislot-${Environment}-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - ec2.amazonaws.com
                      - scheduler.amazonaws.com
                      - apigateway.amazonaws.com
              - Sid: ReadMediSlotRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetInstanceProfile
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/medislot-${Environment}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/medislot-${Environment}-*
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  - logs:GetDataProtectionPolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/medislot-${Environment}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/medislot/${Environment}/*
              - Sid: LogsReadOnly
                Effect: Allow
                Action: logs:Describe*
                Resource: '*'
              - Sid: SsmParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                  - ssm:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*
              - Sid: PublicAmiParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*
              - Sid: SsmReadOnly
                Effect: Allow
                Action: ssm:DescribeParameters
                Resource: '*'
              - Sid: WebInstanceAndNetworking
                Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:ModifyInstanceCreditSpecification
                  - ec2:AssociateIamInstanceProfile
                  - ec2:DisassociateIamInstanceProfile
                  - ec2:ReplaceIamInstanceProfileAssociation
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:ModifySecurityGroupRules
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - ec2:Describe*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/account
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: Scheduler
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:TagResource
                  - scheduler:UntagResource
                  - scheduler:Get*
                  - scheduler:List*
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*/medislot-${Environment}-*
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/*
              - Sid: AlarmTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:Get*
                  - sns:List*
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:DescribeAlarms
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:medislot-${Environment}-*
              - Sid: AlarmsReadOnly
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'

Outputs:
  AuthorizerLambdaRoleArn:
    Value: !GetAtt AuthorizerLambdaRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-authorizer-role-arn
  AuthLambdaRoleArn:
    Value: !GetAtt AuthLambdaRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-auth-role-arn
  DoctorProfileRoleArn:
    Value: !GetAtt DoctorProfileRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-doctor-profile-role-arn
  PhotoUploadRoleArn:
    Value: !GetAtt PhotoUploadRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-photo-upload-role-arn
  ConsultationTypesRoleArn:
    Value: !GetAtt ConsultationTypesRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-consultation-types-role-arn
  AvailabilityRoleArn:
    Value: !GetAtt AvailabilityRole.Arn
    Export:
