  DoctorSearchRoleArn:
    Value: !GetAtt DoctorSearchRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-doctor-search-role-arn
  SlotLookupRoleArn:
    Value: !GetAtt SlotLookupRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-slot-lookup-role-arn
  DbMigrateRoleArn:
    Value: !GetAtt DbMigrateRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-db-migrate-role-arn
  BookingRoleArn:
    Value: !GetAtt BookingRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-booking-role-arn
  CancelRoleArn:
    Value: !GetAtt CancelRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-cancel-role-arn
  RefundHistoryRoleArn:
    Value: !GetAtt RefundHistoryRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-refund-history-role-arn
  OutcomeRoleArn:
    Value: !GetAtt OutcomeRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-outcome-role-arn
  SlotCancelRoleArn:
    Value: !GetAtt SlotCancelRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-slot-cancel-role-arn
  RescheduleStarterRoleArn:
    Value: !GetAtt RescheduleStarterRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-reschedule-starter-role-arn
  WaitlistRoleArn:
    Value: !GetAtt WaitlistRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-waitlist-role-arn
  WaitlistProcessorRoleArn:
    Value: !GetAtt WaitlistProcessorRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-waitlist-processor-role-arn
  NotificationRoleArn:
    Value: !GetAtt NotificationRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-notification-role-arn
  OfferExpiryRoleArn:
    Value: !GetAtt OfferExpiryRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-offer-expiry-role-arn
  ReminderRoleArn:
    Value: !GetAtt ReminderRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-reminder-role-arn
  NoShowRoleArn:
    Value: !GetAtt NoShowRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-no-show-role-arn
  SchedulerInvokeRoleArn:
    Value: !GetAtt SchedulerInvokeRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-scheduler-invoke-role-arn
  ApiGatewayCloudWatchRoleArn:
    Value: !GetAtt ApiGatewayCloudWatchRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-apigateway-logs-role-arn
  DashboardEC2RoleArn:
