AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MediSlot network infrastructure - VPC, public and private subnets,
  security groups, and VPC endpoints. No NAT Gateway.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - prod

  VPCCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the MediSlot VPC.

  SSHAllowedCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
    Description: >-
      Public IPv4 CIDR allowed to SSH to the EC2 instance. Set to your current
      public IP with /32 when deploying. The loopback default keeps SSH closed.

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public EC2 subnet.

  PrivateLambdaSubnetAZ1Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the first private Lambda subnet.

  PrivateLambdaSubnetAZ2Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for the second private Lambda subnet.

  PrivateRDSSubnetAZ1Cidr:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR block for the first private RDS subnet.

  PrivateRDSSubnetAZ2Cidr:
    Type: String
    Default: 10.0.5.0/24
    Description: CIDR block for the second private RDS subnet.

  # No default on purpose: prefix list IDs differ per region, and a silent
  # us-east-1 default is wrong everywhere else.
  DynamoDBPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]{8,17}$'
    ConstraintDescription: Must be a managed prefix list ID such as pl-02cd2c6b.
    Description: >-
      AWS-managed prefix list ID for com.amazonaws.REGION.dynamodb in the deployment region.
      Retrieve it with aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.REGION.dynamodb

  S3PrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]{8,17}$'
    ConstraintDescription: Must be the AWS-managed S3 prefix list ID for the deployment region.
    Description: >-
      AWS-managed prefix list ID for com.amazonaws.REGION.s3 in the deployment region.
      Retrieve it with aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.REGION.s3

  SingleAZInterfaceEndpoints:
    Type: String
    Description: >-
      Place interface endpoints in one AZ only. Interface endpoints are billed per
      endpoint per AZ per hour and are not Free Tier, so one AZ halves the cost.
      RDS is single-AZ by design, so this does not reduce real availability.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableSSMEndpoint:
    Type: String
    Description: SSM interface endpoint (Parameter Store - JWT secret, config). Required by every Lambda that reads config.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableCloudWatchLogsEndpoint:
    Type: String
    Description: CloudWatch Logs interface endpoint for VPC-connected Lambda logging without NAT.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableSecretsManagerEndpoint:
    Type: String
    Description: Secrets Manager interface endpoint. Not required while credentials are read from SSM Parameter Store.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableSNSEndpoint:
    Type: String
    Description: SNS interface endpoint for notification publishing (needed from Milestone 6).
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableEventBridgeEndpoint:
    Type: String
    Description: EventBridge interface endpoint for domain event publishing (needed from Milestone 5).
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableStepFunctionsEndpoint:
    Type: String
    Description: Step Functions interface endpoint for starting the reschedule saga (needed from Milestone 6).
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableSQSEndpoint:
    Type: String
    Description: SQS interface endpoint for Lambdas that send to queues (needed from Milestone 6).
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableXRayEndpoint:
    Type: String
    Description: X-Ray interface endpoint so VPC-connected Lambdas can send trace segments.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableMonitoringEndpoint:
    Type: String
    Description: >-
      CloudWatch Monitoring interface endpoint for PutMetricData. Not needed if custom
      metrics are emitted through Embedded Metric Format in logs.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableSchedulerEndpoint:
    Type: String
    Description: >-
      EventBridge Scheduler interface endpoint. Only needed if Lambdas create or delete
      schedules at runtime. Not needed for the recurring sweepers.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  SingleAZEndpoints: !Equals
    - !Ref SingleAZInterfaceEndpoints
    - 'true'

  CreateSSMEndpoint: !Equals
    - !Ref EnableSSMEndpoint
    - 'true'

  CreateCloudWatchLogsEndpoint: !Equals
    - !Ref EnableCloudWatchLogsEndpoint
    - 'true'

  CreateSecretsManagerEndpoint: !Equals
    - !Ref EnableSecretsManagerEndpoint
    - 'true'

  CreateSNSEndpoint: !Equals
    - !Ref EnableSNSEndpoint
    - 'true'

  CreateEventBridgeEndpoint: !Equals
    - !Ref EnableEventBridgeEndpoint
    - 'true'

  CreateStepFunctionsEndpoint: !Equals
    - !Ref EnableStepFunctionsEndpoint
    - 'true'

  CreateSQSEndpoint: !Equals
    - !Ref EnableSQSEndpoint
    - 'true'

  CreateXRayEndpoint: !Equals
    - !Ref EnableXRayEndpoint
    - 'true'

  CreateMonitoringEndpoint: !Equals
    - !Ref EnableMonitoringEndpoint
    - 'true'

  CreateSchedulerEndpoint: !Equals
    - !Ref EnableSchedulerEndpoint
    - 'true'

  CreateAnyInterfaceEndpoint: !Or
    - !Condition CreateSSMEndpoint
    - !Condition CreateCloudWatchLogsEndpoint
    - !Condition CreateSecretsManagerEndpoint
    - !Condition CreateSNSEndpoint
    - !Condition CreateEventBridgeEndpoint
    - !Condition CreateStepFunctionsEndpoint
    - !Condition CreateSQSEndpoint
    - !Condition CreateXRayEndpoint
    - !Condition CreateMonitoringEndpoint
    - !Condition CreateSchedulerEndpoint

Resources:

  # --------------------------------------------------
  # 1. VPC
  # --------------------------------------------------

  MediSlotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-vpc
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-igw
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MediSlotVPC
      InternetGatewayId: !Ref InternetGateway

  # --------------------------------------------------
  # 2. Public subnet for Flask web application on EC2
  # --------------------------------------------------

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-public-subnet
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-public-rt
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------
  # 3. Private subnets for VPC-connected Lambda functions
  # --------------------------------------------------

  PrivateLambdaSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateLambdaSubnetAZ1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-lambda-private-az1
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateLambdaSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateLambdaSubnetAZ2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-lambda-private-az2
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateLambdaRouteTableAZ1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-lambda-private-rt-az1
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateLambdaRouteTableAZ2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-lambda-private-rt-az2
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateLambdaSubnetAssociationAZ1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateLambdaSubnetAZ1
      RouteTableId: !Ref PrivateLambdaRouteTableAZ1

  PrivateLambdaSubnetAssociationAZ2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateLambdaSubnetAZ2
      RouteTableId: !Ref PrivateLambdaRouteTableAZ2

  # --------------------------------------------------
  # 4. Private subnets for RDS MySQL (no internet route, no endpoints)
  # --------------------------------------------------

  PrivateRDSSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateRDSSubnetAZ1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-rds-private-az1
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateRDSSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MediSlotVPC
      CidrBlock: !Ref PrivateRDSSubnetAZ2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-rds-private-az2
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateRDSRouteTableAZ1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-rds-private-rt-az1
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateRDSRouteTableAZ2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MediSlotVPC
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-rds-private-rt-az2
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  PrivateRDSSubnetAssociationAZ1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateRDSSubnetAZ1
      RouteTableId: !Ref PrivateRDSRouteTableAZ1

  PrivateRDSSubnetAssociationAZ2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateRDSSubnetAZ2
      RouteTableId: !Ref PrivateRDSRouteTableAZ2

  # --------------------------------------------------
  # 5. Security groups
  # --------------------------------------------------

  # The Flask web app is a pure API client: it talks only to the public API
  # Gateway endpoint and S3 over HTTPS. It has no path to RDS.
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP access to the MediSlot Flask web server
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: SSH only from the operator-supplied public IP range
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAllowedCidr
      SecurityGroupEgress:
        - Description: HTTPS to API Gateway, S3 and OS/package repositories
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-ec2-sg
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Network access for VPC-connected MediSlot Lambdas
      VpcId: !Ref MediSlotVPC
      # Intended to remove the default allow-all egress rule; the standalone
      # egress resources below define the permitted destinations and ports.
      # VERIFY after deploy: aws ec2 describe-security-groups --group-ids <id>
      # must show no 0.0.0.0/0 all-protocol egress rule.
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-lambda-sg
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  # MySQL is reachable from the Lambda security group only.
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL from the MediSlot Lambda security group only
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: MySQL from MediSlot Lambda functions
          IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-rds-sg
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  LambdaToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      Description: MySQL connections to RDS
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup

  LambdaToDynamoDBEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      Description: HTTPS access to DynamoDB Gateway VPC endpoint
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref DynamoDBPrefixListId

  LambdaToS3Egress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      Description: HTTPS access to S3 Gateway VPC endpoint
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3PrefixListId

  # --------------------------------------------------
  # 6. Gateway VPC endpoints (no hourly endpoint charge)
  #    Attached to Lambda route tables only. RDS subnets get no endpoints.
  # --------------------------------------------------

  DynamoDBGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      RouteTableIds:
        - !Ref PrivateLambdaRouteTableAZ1
        - !Ref PrivateLambdaRouteTableAZ2

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref PrivateLambdaRouteTableAZ1
        - !Ref PrivateLambdaRouteTableAZ2

  # --------------------------------------------------
  # 7. Interface endpoint security group
  # --------------------------------------------------

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateAnyInterfaceEndpoint
    Properties:
      GroupDescription: HTTPS from MediSlot Lambda functions to AWS endpoints
      VpcId: !Ref MediSlotVPC
      SecurityGroupIngress:
        - Description: HTTPS from Lambda security group
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-vpce-sg
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  LambdaToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: CreateAnyInterfaceEndpoint
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      Description: HTTPS to AWS interface endpoints
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup

  # --------------------------------------------------
  # 8. Optional paid interface endpoints
  #    Billed per endpoint per AZ per hour. Enable only what the current
  #    milestone needs and tear down idle environments.
  # --------------------------------------------------

  SSMInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSSMEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-ssm-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  CloudWatchLogsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateCloudWatchLogsEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-logs-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  SecretsManagerInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSecretsManagerEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-secretsmanager-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  SNSInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSNSEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-sns-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  EventBridgeInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEventBridgeEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.events
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-events-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  StepFunctionsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateStepFunctionsEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.states
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-states-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  SQSInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSQSEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-sqs-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  XRayInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateXRayEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.xray
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-xray-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  MonitoringInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateMonitoringEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.monitoring
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-monitoring-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

  SchedulerInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSchedulerEndpoint
    Properties:
      VpcId: !Ref MediSlotVPC
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.scheduler
      PrivateDnsEnabled: true
      SubnetIds: !If
        - SingleAZEndpoints
        - [!Ref PrivateLambdaSubnetAZ1]
        - [!Ref PrivateLambdaSubnetAZ1, !Ref PrivateLambdaSubnetAZ2]
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-scheduler-endpoint
        - Key: Project
          Value: medislot
        - Key: Environment
          Value: !Ref Environment

Outputs:

  VPCId:
    Description: MediSlot VPC ID
    Value: !Ref MediSlotVPC
    Export:
      Name: !Sub medislot-${Environment}-vpc-id

  PublicSubnetId:
    Description: Public subnet for the Flask EC2 instance
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub medislot-${Environment}-public-subnet-id

  PrivateLambdaSubnetAZ1Id:
    Description: Private Lambda subnet in Availability Zone 1
    Value: !Ref PrivateLambdaSubnetAZ1
    Export:
      Name: !Sub medislot-${Environment}-lambda-subnet-az1-id

  PrivateLambdaSubnetAZ2Id:
    Description: Private Lambda subnet in Availability Zone 2
    Value: !Ref PrivateLambdaSubnetAZ2
    Export:
      Name: !Sub medislot-${Environment}-lambda-subnet-az2-id

  PrivateRDSSubnetAZ1Id:
    Description: Private RDS subnet in Availability Zone 1
    Value: !Ref PrivateRDSSubnetAZ1
    Export:
      Name: !Sub medislot-${Environment}-rds-subnet-az1-id

  PrivateRDSSubnetAZ2Id:
    Description: Private RDS subnet in Availability Zone 2
    Value: !Ref PrivateRDSSubnetAZ2
    Export:
      Name: !Sub medislot-${Environment}-rds-subnet-az2-id

  EC2SecurityGroupId:
    Description: EC2 security group; HTTP ingress, HTTPS-only egress, no database access
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub medislot-${Environment}-ec2-sg-id

  LambdaSecurityGroupId:
    Description: Lambda security group for database and endpoint access
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub medislot-${Environment}-lambda-sg-id

  RDSSecurityGroupId:
    Description: RDS security group; MySQL ingress from the Lambda SG only
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub medislot-${Environment}-rds-sg-id

  InternetGatewayId:
    Description: Internet Gateway attached to the VPC
    Value: !Ref InternetGateway
    Export:
      Name: !Sub medislot-${Environment}-igw-id
