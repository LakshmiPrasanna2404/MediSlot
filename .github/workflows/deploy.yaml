
name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cfn-lint yamllint

      - name: Lint YAML files
        run: |
          yamllint -d relaxed \
            .github/workflows/deploy.yaml \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml

      - name: Lint CloudFormation templates
        run: |
          cfn-lint infrastructure/network-stack.yaml
          cfn-lint infrastructure/data-stack.yaml
          cfn-lint infrastructure/iam-stack.yaml

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation templates
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml
          do
            test -s "$template"
            echo "Validating $template"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"
          done

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              EnableInterfaceEndpoints=false \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify IAM
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "IAM: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]
