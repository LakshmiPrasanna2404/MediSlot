name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint PyYAML

      - name: Check required templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml
          do
            if [[ ! -s "$template" ]]; then
              echo "::error::Template missing or empty: $template"
              exit 1
            fi

            echo "Found: $template"
            sha256sum "$template"
          done

      - name: Lint YAML formatting
        run: |
          set -euo pipefail
          yamllint -d relaxed \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml

      - name: Verify CloudFormation YAML structure
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def construct_intrinsic(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              raise yaml.YAMLError(f"Unsupported intrinsic tag: !{tag_suffix}")

          CloudFormationLoader.add_multi_constructor("!", construct_intrinsic)

          templates = [
              Path("infrastructure/network-stack.yaml"),
              Path("infrastructure/data-stack.yaml"),
              Path("infrastructure/iam-stack.yaml"),
          ]

          for path in templates:
              print(f"\nChecking {path}")

              with path.open("r", encoding="utf-8-sig") as file:
                  document = yaml.load(file, Loader=CloudFormationLoader)

              if not isinstance(document, dict):
                  raise ValueError(f"{path}: document root must be a mapping")

              resources = document.get("Resources")
              if not isinstance(resources, dict) or not resources:
                  raise ValueError(f"{path}: Resources must be a non-empty mapping")

              print(f"Resource count: {len(resources)}")
              print("YAML structure passed.")
          PY

      - name: Lint Network template
        run: cfn-lint --template infrastructure/network-stack.yaml

      - name: Lint Data template
        run: cfn-lint --template infrastructure/data-stack.yaml

      - name: Lint IAM template
        run: cfn-lint --template infrastructure/iam-stack.yaml --ignore-checks W3037

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate templates with AWS
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml
          do
            echo "Validating $template"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"

            echo "Validation passed: $template"
          done

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              EnableInterfaceEndpoints=false \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || \
             "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || \
             "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify IAM
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "IAM stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || \
             "$STATUS" == "UPDATE_COMPLETE" ]]
