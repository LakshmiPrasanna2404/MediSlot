name: MediSlot CloudFormation CI/CD Pipeline

# One workflow for everything.
#   Pull request into main: Lint, Security scans, Unit tests (required checks).
#   Push to main (or Run workflow): the same checks, then package, one job per
#   stack (each a CloudFormation change set), database migrations, integration
#   tests against the deployed API, and a smoke test.
#
# AWS access is the AWS_ROLE_ARN repository secret (GitHub OIDC). network,
# data and iam are deployed with that role; every other stack through the
# CloudFormation execution role that the iam stack creates. Each deploy job
# assumes the role again, so no job relies on credentials older than an hour.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: CloudFormation deployment environment
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

# Pull requests: a new push cancels the previous run of the same PR.
# Deployments: one at a time per environment, never cancelled halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('medislot-pr-{0}', github.event.pull_request.number) || format('medislot-deploy-{0}', inputs.environment || 'dev') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ---------------------------------------------------------------- checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff, yamllint, cfn-lint
        run: bash scripts/ci/lint.sh

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: IaC scan (checkov)
        run: |
          pip install checkov==3.2.459 cfn-flip==1.3.0
          bash scripts/ci/iac_scan.sh

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: medislot
          MYSQL_PASSWORD: medislot-test-pw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot-test-only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEDISLOT_TEST_DB_HOST: 127.0.0.1
      MEDISLOT_TEST_DB_USER: medislot
      MEDISLOT_TEST_DB_PASSWORD: medislot-test-pw
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Let the test user create test databases
        run: mysql -h 127.0.0.1 -uroot -proot-test-only -e "GRANT ALL PRIVILEGES ON *.* TO 'medislot'@'%'; FLUSH PRIVILEGES;"
      - name: pytest (real MySQL 8.4, AWS mocked with moto)
        run: python -m pytest tests/unit -q

  # ------------------------------------------------------------- packaging
  prepare:
    name: Prepare and Package
    if: github.event_name != 'pull_request'
    needs: [lint, security, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          [[ -n "$AWS_REGION" ]] || { echo "::error::Repository variable AWS_REGION is missing"; exit 1; }
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::Repository secret AWS_ROLE_ARN is missing"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Artifacts bucket (created on the first run)
        run: bash scripts/ci/ensure_artifact_bucket.sh
      - name: Secrets in SSM (random values, created only if missing, never printed)
        run: bash scripts/seed_secrets.sh "$ENVIRONMENT"
      - name: RDS engine version
        run: |
          VERSION=$(aws rds describe-db-instances --db-instance-identifier "medislot-${ENVIRONMENT}-mysql" \
            --query 'DBInstances[0].EngineVersion' --output text 2>/dev/null || echo "not created yet")
          echo "RDS MySQL engine: $VERSION"
          if [[ "$VERSION" == 8.0.* ]]; then
            echo "::warning::RDS MySQL 8.0 is past end of standard support and bills Extended Support. Upgrade to 8.4 (docs/runbook.md)."
          fi
      - name: RDS certificate bundle (Lambdas verify TLS to MySQL against it)
        run: |
          mkdir -p build
          curl -sSfL -o build/rds-ca-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      - name: Build and upload Lambda and web app packages
        run: python scripts/build_lambdas.py --env "$ENVIRONMENT" --ca-bundle build/rds-ca-bundle.pem --upload "$ARTIFACT_BUCKET"
      - name: Render the API template
        run: python scripts/render_api_template.py
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-inputs
          path: |
            build/manifest.json
            build/templates/api-stack.yaml

  # ---------------------------------------------------------------- stacks
  deploy-network:
    name: Deploy Network Stack
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Regional prefix lists
        id: prefix
        run: |
          for svc in s3 dynamodb; do
            id=$(aws ec2 describe-managed-prefix-lists --filters "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.${svc}" \
              --query 'PrefixLists[0].PrefixListId' --output text)
            [[ "$id" == pl-* ]] || { echo "::error::No ${svc} managed prefix list in ${AWS_REGION}"; exit 1; }
            echo "${svc}=${id}" >> "$GITHUB_OUTPUT"
          done
      - name: Network
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-network"
          --template infrastructure/network-stack.yaml --bucket "$ARTIFACT_BUCKET"
          --param "Environment=${ENVIRONMENT}"
          --param "S3PrefixListId=${{ steps.prefix.outputs.s3 }}"
          --param "DynamoDBPrefixListId=${{ steps.prefix.outputs.dynamodb }}"
          --protect MediSlotVPC --protect PublicSubnet
          --protect PrivateLambdaSubnetAZ1 --protect PrivateLambdaSubnetAZ2
          --protect PrivateRDSSubnetAZ1 --protect PrivateRDSSubnetAZ2

  deploy-data:
    name: Deploy Data Stack
    needs: deploy-network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      # Tables and the photo bucket that were made by hand are imported into
      # the stack the first time (an IMPORT change set); afterwards a no-op.
      # --protect: if an update would replace the database, a table or the
      # photo bucket, the job stops before anything changes.
      - name: Data
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-data"
          --template infrastructure/data-stack.yaml --bucket "$ARTIFACT_BUCKET"
          --param "Environment=${ENVIRONMENT}"
          --import RefreshTokensTable --import TokenRevocationsTable --import IdempotencyTable
          --import DoctorProfileFilesBucket
          --protect MediSlotMySQL --protect DoctorProfileFilesBucket
          --protect RefreshTokensTable --protect TokenRevocationsTable --protect SlotsTable --protect SeatsTable
          --protect WaitlistTable --protect HoldOffersTable --protect IdempotencyTable --protect DispatchLogTable

  deploy-iam:
    name: Deploy IAM Stack
    needs: deploy-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: IAM
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-iam"
          --template infrastructure/iam-stack.yaml --bucket "$ARTIFACT_BUCKET"
          --param "Environment=${ENVIRONMENT}"

  deploy-config:
    name: Deploy Config Stack
    needs: deploy-iam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Config (business rules in SSM)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-config"
          --template infrastructure/config-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}"

  deploy-auth:
    name: Deploy Auth and Authorizer Lambdas
    needs: deploy-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: deploy-inputs
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Auth and Authorizer
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-auth"
          --template infrastructure/auth-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}"
          --param "AuthCodeS3Bucket=$ARTIFACT_BUCKET"
          --param "AuthCodeS3Key=$(jq -r '.functions.auth' build/manifest.json)"
          --param "AuthorizerCodeS3Bucket=$ARTIFACT_BUCKET"
          --param "AuthorizerCodeS3Key=$(jq -r '.functions.authorizer' build/manifest.json)"

  deploy-app:
    name: Deploy Doctor and Patient Lambdas
    needs: deploy-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: deploy-inputs
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: App (doctor and patient domain Lambdas, db-migrate)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-app"
          --template infrastructure/app-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}" --param "CodeS3Bucket=$ARTIFACT_BUCKET"
          --param "DoctorProfileCodeS3Key=$(jq -r '.functions["doctor-profile"]' build/manifest.json)"
          --param "PhotoUploadCodeS3Key=$(jq -r '.functions["photo-upload"]' build/manifest.json)"
          --param "ConsultationTypesCodeS3Key=$(jq -r '.functions["consultation-types"]' build/manifest.json)"
          --param "AvailabilityCodeS3Key=$(jq -r '.functions.availability' build/manifest.json)"
          --param "ScheduleCodeS3Key=$(jq -r '.functions.schedule' build/manifest.json)"
          --param "PatientProfileCodeS3Key=$(jq -r '.functions["patient-profile"]' build/manifest.json)"
          --param "DoctorSearchCodeS3Key=$(jq -r '.functions["doctor-search"]' build/manifest.json)"
          --param "SlotLookupCodeS3Key=$(jq -r '.functions["slot-lookup"]' build/manifest.json)"
          --param "DbMigrateCodeS3Key=$(jq -r '.functions["db-migrate"]' build/manifest.json)"

  deploy-jobs:
    name: Deploy Scheduled Jobs
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: deploy-inputs
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Jobs (slot materialiser and its daily schedule)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-jobs"
          --template infrastructure/jobs-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}" --param "CodeS3Bucket=$ARTIFACT_BUCKET"
          --param "SlotMaterialiserCodeS3Key=$(jq -r '.functions["slot-materialiser"]' build/manifest.json)"

  deploy-monitoring:
    name: Deploy Monitoring and Alarms
    needs: deploy-jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Monitoring
        env:
          # Optional repository variable. Empty means the alarm topic has no subscriber.
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-monitoring"
          --template infrastructure/monitoring-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}" --param "AlarmEmail=${ALARM_EMAIL:-}"

  deploy-web:
    name: Deploy Web App (EC2)
    needs: deploy-monitoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: deploy-inputs
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Web app
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-dashboard"
          --template infrastructure/dashboard-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}"
          --param "DashboardCodeS3Bucket=$ARTIFACT_BUCKET"
          --param "DashboardCodeS3Key=$(jq -r '.dashboard' build/manifest.json)"

  deploy-api:
    name: Deploy REST API
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: deploy-inputs
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: API (REST API, JWT authorizer, routes)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-api"
          --template build/templates/api-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}"

  # ------------------------------------------------------- after deployment
  migrate:
    name: Database Migrations
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # "check" proves a Lambda in the private subnets reaches RDS over TLS;
      # "migrate" applies pending files from database/migrations in order.
      - name: Connectivity check, then pending migrations
        run: |
          for action in check migrate status; do
            aws lambda invoke --function-name "medislot-${ENVIRONMENT}-db-migrate" \
              --cli-binary-format raw-in-base64-out --payload "{\"action\":\"${action}\"}" \
              --cli-read-timeout 300 out.json > meta.json
            echo "--- ${action}"; cat out.json; echo
            if grep -q FunctionError meta.json; then echo "::error::db-migrate ${action} failed"; exit 1; fi
          done

  integration:
    name: Integration Tests
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run against the deployed API
        env:
          MEDISLOT_ENV: ${{ env.ENVIRONMENT }}
          MEDISLOT_READ_JWT_SECRET: 'true'
        run: python -m pytest tests/integration -q -m integration

  smoke:
    name: Smoke Test
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: API and web app answer
        run: |
          output() { aws cloudformation describe-stacks --stack-name "$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" --output text; }
          API=$(output "medislot-${ENVIRONMENT}-api" ApiUrl)
          WEB=$(output "medislot-${ENVIRONMENT}-dashboard" DashboardUrl)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/auth/patients/login" -H 'Content-Type: application/json' \
                 -d '{"email":"smoke@example.invalid","password":"not-a-real-password1"}')
          [[ "$code" == 401 ]] || { echo "::error::login with bad credentials returned $code, expected 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/doctors")
          [[ "$code" == 401 ]] || { echo "::error::GET /doctors without a token returned $code, expected 401"; exit 1; }
          for attempt in $(seq 1 30); do
            if curl -sf "$WEB/" | grep -q "Login as Doctor"; then break; fi
            [[ $attempt == 30 ]] && { echo "::error::web app not answering at $WEB"; exit 1; }
            sleep 10
          done
          echo "API: $API"
          echo "Web app: $WEB"
