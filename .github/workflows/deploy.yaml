
name: MediSlot CloudFormation Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Validate and Deploy MediSlot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Validate every template before deploying any stack.
      - name: Validate all CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml
          do
            echo "Validating ${template}"

            if [[ ! -s "$template" ]]; then
              echo "::error::Missing or empty template: ${template}"
              exit 1
            fi

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"

            echo "Validation passed: ${template}"
          done

      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              EnableInterfaceEndpoints=false \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Deploy data stack
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Deploy IAM stack
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Deploy authentication stack
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --template-file infrastructure/auth-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Deploy application stack
        run: |
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --template-file infrastructure/app-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify deployed stacks
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          for stack in network data iam auth app; do
            echo "Checking medislot-${ENVIRONMENT}-${stack}"

            aws cloudformation describe-stacks \
              --stack-name "medislot-${ENVIRONMENT}-${stack}" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].[StackName,StackStatus]' \
              --output table
          done
