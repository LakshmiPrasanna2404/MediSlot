
name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: CloudFormation deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:

  # 1. VALIDATE
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$AWS_REGION" ]] || {
            echo "::error::AWS_REGION is not configured"
            exit 1
          }

          [[ -n "$AWS_ROLE_ARN" ]] || {
            echo "::error::AWS_ROLE_ARN is not configured"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint

      - name: Check required templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml
          do
            if [[ ! -s "$template" ]]; then
              echo "::error::Missing template: $template"
              exit 1
            fi
          done

      - name: Lint templates
        shell: bash
        run: |
          set -euo pipefail

          yamllint -d relaxed \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml

          cfn-lint --non-zero-exit-code error \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml
          do
            echo "Validating $template"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION" >/dev/null
          done

  # 2. NETWORK
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network stack
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 3. DATA
  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data stack
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 4. IAM
  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "IAM stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 5. APP LAMBDA AND API
  deploy-app:
    name: Deploy App Lambda and API
    runs-on: ubuntu-latest
    needs: deploy-iam

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read deployment configuration
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue | [0]" \
            --output text)

          CFN_EXECUTION_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFormationExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          if [[ -z "$BUCKET" || "$BUCKET" == "None" ]]; then
            echo "::error::ArtifactBucketName output is missing"
            exit 1
          fi

          if [[ -z "$CFN_EXECUTION_ROLE_ARN" || "$CFN_EXECUTION_ROLE_ARN" == "None" ]]; then
            echo "::error::CloudFormationExecutionRoleArn output is missing"
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "execution_role=$CFN_EXECUTION_ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Package App Lambda
        shell: bash
        run: |
          set -euo pipefail

          test -s lambda/app/app_handler.py
          test -s lambda/app/requirements.txt

          rm -rf build/app app.zip
          mkdir -p build/app

          python -m pip install \
            --only-binary=:all: \
            -r lambda/app/requirements.txt \
            -t build/app

          cp lambda/app/app_handler.py build/app/

          (
            cd build/app
            zip -qr ../../app.zip .
          )

          test -s app.zip

      - name: Upload App Lambda package
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp app.zip \
            "s3://${{ steps.deployment.outputs.bucket }}/lambda/app-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Validate App template
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://infrastructure/app-stack.yaml \
            --region "$AWS_REGION" >/dev/null

      - name: Deploy App and API
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-api" \
            --template-file infrastructure/app-stack.yaml \
            --role-arn "${{ steps.deployment.outputs.execution_role }}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AppCodeS3Bucket="${{ steps.deployment.outputs.bucket }}" \
              AppCodeS3Key="lambda/app-${GITHUB_SHA}.zip" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify App Lambda
        shell: bash
        run: |
          set -euo pipefail

          aws lambda get-function-configuration \
            --function-name "medislot-${ENVIRONMENT}-app" \
            --region "$AWS_REGION" \
            --query '{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Verify API outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-api" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Verify App API URL
        shell: bash
        run: |
          set -euo pipefail

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-api" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='AppApiUrl'].OutputValue | [0]" \
            --output text)

          if [[ -z "$API_URL" || "$API_URL" == "None" ]]; then
            echo "::error::AppApiUrl output is missing"
            exit 1
          fi

          echo "MediSlot App API URL: $API_URL"
