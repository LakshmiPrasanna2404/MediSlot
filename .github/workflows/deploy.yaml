name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow from main
        uses: actions/checkout@v4

      - name: Checkout Network Stack
        uses: actions/checkout@v4
        with:
          ref: feature/network-stack
          path: stack-sources/network

      - name: Checkout Data Stack
        uses: actions/checkout@v4
        with:
          ref: feature/data-stack
          path: stack-sources/data

      - name: Checkout IAM Stack
        uses: actions/checkout@v4
        with:
          ref: feature/iam-stack
          path: stack-sources/iam

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cfn-lint yamllint
          cfn-lint --version
          yamllint --version

      - name: Check required templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            stack-sources/network/infrastructure/network-stack.yaml \
            stack-sources/data/infrastructure/data-stack.yaml \
            stack-sources/iam/infrastructure/iam-stack.yaml
          do
            if [[ ! -s "$template" ]]; then
              echo "::error::Missing or empty template: $template"
              exit 1
            fi
          done

      - name: Lint YAML files
        run: |
          yamllint -d relaxed .github/workflows/deploy.yaml
          yamllint -d relaxed \
            stack-sources/network/infrastructure/network-stack.yaml \
            stack-sources/data/infrastructure/data-stack.yaml \
            stack-sources/iam/infrastructure/iam-stack.yaml

      - name: Lint CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          cfn-lint stack-sources/network/infrastructure/network-stack.yaml
          cfn-lint stack-sources/data/infrastructure/data-stack.yaml
          cfn-lint --ignore-checks W3037 \
            stack-sources/iam/infrastructure/iam-stack.yaml

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            stack-sources/network/infrastructure/network-stack.yaml \
            stack-sources/data/infrastructure/data-stack.yaml \
            stack-sources/iam/infrastructure/iam-stack.yaml
          do
            echo "Validating $template"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"

            echo "Validation passed: $template"
          done

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Network Stack
        uses: actions/checkout@v4
        with:
          ref: feature/network-stack
          path: stack-source

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file stack-source/infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              EnableInterfaceEndpoints=false \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - name: Checkout Data Stack
        uses: actions/checkout@v4
        with:
          ref: feature/data-stack
          path: stack-source

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file stack-source/infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - name: Checkout IAM Stack
        uses: actions/checkout@v4
        with:
          ref: feature/iam-stack
          path: stack-source

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file stack-source/infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify IAM
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "IAM stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]