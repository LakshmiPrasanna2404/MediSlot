
name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ARTIFACT_BUCKET: cloudmart-artifacts-393476285814

jobs:
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint

      - name: Check implemented templates
        shell: bash
        run: |
          set -euo pipefail
          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml
          do
            test -s "$template" || {
              echo "::error::Missing or empty template: $template"
              exit 1
            }
          done

      - name: Lint implemented templates
        run: |
          set -euo pipefail
          yamllint -d relaxed \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml

          cfn-lint infrastructure/network-stack.yaml
          cfn-lint infrastructure/data-stack.yaml
          cfn-lint infrastructure/iam-stack.yaml
          cfn-lint infrastructure/auth-stack.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail
          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml
          do
            echo "Validating ${template}"
            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"
          done

  deploy-network:
    name: Deploy Existing Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

  deploy-data:
    name: Deploy Existing Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

  deploy-iam:
    name: Deploy Existing IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

  deploy-auth:
    name: Deploy Existing Auth Stack
    runs-on: ubuntu-latest
    needs: deploy-iam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip

      - name: Package Auth Lambda
        shell: bash
        run: |
          set -euo pipefail
          test -s lambda/auth/auth_handler.py
          test -s lambda/auth/requirements.txt

          rm -rf build/auth
          mkdir -p build/auth

          python -m pip install \
            --only-binary=:all: \
            -r lambda/auth/requirements.txt \
            -t build/auth

          cp lambda/auth/auth_handler.py build/auth/

          (
            cd build/auth
            zip -qr ../../auth.zip .
          )

      - name: Package Authorizer Lambda
        shell: bash
        run: |
          set -euo pipefail
          test -s lambda/authorizer/authorizer_handler.py

          rm -rf build/authorizer
          mkdir -p build/authorizer
          cp lambda/authorizer/authorizer_handler.py build/authorizer/

          (
            cd build/authorizer
            zip -qr ../../authorizer.zip .
          )

      - name: Upload Lambda packages
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp auth.zip \
            "s3://${ARTIFACT_BUCKET}/medislot/${ENVIRONMENT}/auth/auth-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp authorizer.zip \
            "s3://${ARTIFACT_BUCKET}/medislot/${ENVIRONMENT}/auth/authorizer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Validate Auth template
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body file://infrastructure/auth-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Auth
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --template-file infrastructure/auth-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AuthCodeS3Bucket="${ARTIFACT_BUCKET}" \
              AuthCodeS3Key="medislot/${ENVIRONMENT}/auth/auth-${GITHUB_SHA}.zip" \
              AuthorizerCodeS3Bucket="${ARTIFACT_BUCKET}" \
              AuthorizerCodeS3Key="medislot/${ENVIRONMENT}/auth/authorizer-${GITHUB_SHA}.zip" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Auth stack
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Auth stack status: ${STATUS}"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-app:
    name: Deploy Application Stack When Implemented
    runs-on: ubuntu-latest
    needs: deploy-auth
    if: ${{ hashFiles('infrastructure/app-stack.yaml') != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Application template
        shell: bash
        run: |
          set -euo pipefail
          test -s infrastructure/app-stack.yaml

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint

      - name: Validate Application template
        shell: bash
        run: |
          set -euo pipefail
          yamllint -d relaxed infrastructure/app-stack.yaml
          cfn-lint infrastructure/app-stack.yaml
          aws cloudformation validate-template \
            --template-body file://infrastructure/app-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Application
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --template-file infrastructure/app-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"
