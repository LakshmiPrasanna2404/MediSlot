name: MediSlot CloudFormation CI/CD Pipeline

# One workflow for everything.
#   Pull request into main: Lint.
#   Push to main (or Run workflow): Lint, then one job per stack, each a
#   CloudFormation change set: network, data, iam, config, auth, app, jobs and
#   the web app.
#
# AWS access is the AWS_ROLE_ARN repository secret (GitHub OIDC). network,
# data and iam are deployed with that role; every other stack through the
# CloudFormation execution role that the iam stack creates. Each deploy job
# assumes the role again, so no job relies on credentials older than an hour.
# Jobs that deploy code build and upload the packages themselves; the builds
# are reproducible, so every job produces the same S3 keys.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: CloudFormation deployment environment
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

# Pull requests: a new push cancels the previous run of the same PR.
# Deployments: one at a time per environment, never cancelled halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('medislot-pr-{0}', github.event.pull_request.number) || format('medislot-deploy-{0}', inputs.environment || 'dev') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ---------------------------------------------------------------- checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff, yamllint, cfn-lint
        run: bash scripts/ci/lint.sh

  # ---------------------------------------------------------------- stacks
  deploy-network:
    name: Deploy Network Stack
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          [[ -n "$AWS_REGION" ]] || { echo "::error::Repository variable AWS_REGION is missing"; exit 1; }
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::Repository secret AWS_ROLE_ARN is missing"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      # The templates are uploaded to this bucket, and the data stack reads the
      # database password from SSM, so both must exist before the first stack.
      - name: Artifacts bucket (created on the first run)
        run: bash scripts/ci/ensure_artifact_bucket.sh
      - name: Secrets in SSM (random values, created only if missing, never printed)
        run: bash scripts/seed_secrets.sh "$ENVIRONMENT"
      - name: Regional prefix lists
        id: prefix
        run: |
          for svc in s3 dynamodb; do
            id=$(aws ec2 describe-managed-prefix-lists --filters "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.${svc}" \
              --query 'PrefixLists[0].PrefixListId' --output text)
            [[ "$id" == pl-* ]] || { echo "::error::No ${svc} managed prefix list in ${AWS_REGION}"; exit 1; }
            echo "${svc}=${id}" >> "$GITHUB_OUTPUT"
          done
      - name: Network
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-network"
          --template infrastructure/network-stack.yaml --bucket "$ARTIFACT_BUCKET"
          --param "Environment=${ENVIRONMENT}"
          --param "S3PrefixListId=${{ steps.prefix.outputs.s3 }}"
          --param "DynamoDBPrefixListId=${{ steps.prefix.outputs.dynamodb }}"
          --protect MediSlotVPC --protect PublicSubnet
          --protect PrivateLambdaSubnetAZ1 --protect PrivateLambdaSubnetAZ2
          --protect PrivateRDSSubnetAZ1 --protect PrivateRDSSubnetAZ2

  deploy-data:
    name: Deploy Data Stack
    needs: deploy-network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      # Tables and the photo bucket that were made by hand are imported into
      # the stack the first time (an IMPORT change set); afterwards a no-op.
      # --protect: if an update would replace the database, a table or the
      # photo bucket, the job stops before anything changes.
      - name: Data
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-data"
          --template infrastructure/data-stack.yaml --bucket "$ARTIFACT_BUCKET"
          --param "Environment=${ENVIRONMENT}"
          --import RefreshTokensTable --import TokenRevocationsTable --import IdempotencyTable
          --import DoctorProfileFilesBucket
          --protect MediSlotMySQL --protect DoctorProfileFilesBucket
          --protect RefreshTokensTable --protect TokenRevocationsTable --protect SlotsTable --protect SeatsTable
          --protect WaitlistTable --protect HoldOffersTable --protect IdempotencyTable --protect DispatchLogTable

  deploy-iam:
    name: Deploy IAM Stack
    needs: deploy-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: IAM
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-iam"
          --template infrastructure/iam-stack.yaml --bucket "$ARTIFACT_BUCKET"
          --param "Environment=${ENVIRONMENT}"

  deploy-auth:
    name: Deploy Auth and Authorizer Lambdas
    needs: deploy-iam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Build and upload packages
        run: |
          mkdir -p build
          curl -sSfL -o build/rds-ca-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          python scripts/build_lambdas.py --env "$ENVIRONMENT" --ca-bundle build/rds-ca-bundle.pem --upload "$ARTIFACT_BUCKET"
      - name: Auth and Authorizer
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-auth"
          --template infrastructure/auth-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}"
          --param "AuthCodeS3Bucket=$ARTIFACT_BUCKET"
          --param "AuthCodeS3Key=$(jq -r '.functions.auth' build/manifest.json)"
          --param "AuthorizerCodeS3Bucket=$ARTIFACT_BUCKET"
          --param "AuthorizerCodeS3Key=$(jq -r '.functions.authorizer' build/manifest.json)"

  deploy-app:
    name: Deploy Doctor and Patient Lambdas
    needs: deploy-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Build and upload packages
        run: |
          mkdir -p build
          curl -sSfL -o build/rds-ca-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          python scripts/build_lambdas.py --env "$ENVIRONMENT" --ca-bundle build/rds-ca-bundle.pem --upload "$ARTIFACT_BUCKET"
      - name: App (doctor and patient domain Lambdas, db-migrate)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-app"
          --template infrastructure/app-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}" --param "CodeS3Bucket=$ARTIFACT_BUCKET"
          --param "DoctorProfileCodeS3Key=$(jq -r '.functions["doctor-profile"]' build/manifest.json)"
          --param "PhotoUploadCodeS3Key=$(jq -r '.functions["photo-upload"]' build/manifest.json)"
          --param "ConsultationTypesCodeS3Key=$(jq -r '.functions["consultation-types"]' build/manifest.json)"
          --param "AvailabilityCodeS3Key=$(jq -r '.functions.availability' build/manifest.json)"
          --param "ScheduleCodeS3Key=$(jq -r '.functions.schedule' build/manifest.json)"
          --param "PatientProfileCodeS3Key=$(jq -r '.functions["patient-profile"]' build/manifest.json)"
          --param "DoctorSearchCodeS3Key=$(jq -r '.functions["doctor-search"]' build/manifest.json)"
          --param "SlotLookupCodeS3Key=$(jq -r '.functions["slot-lookup"]' build/manifest.json)"
          --param "DbMigrateCodeS3Key=$(jq -r '.functions["db-migrate"]' build/manifest.json)"

  deploy-jobs:
    name: Deploy Scheduled Jobs
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Build and upload packages
        run: |
          mkdir -p build
          curl -sSfL -o build/rds-ca-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          python scripts/build_lambdas.py --env "$ENVIRONMENT" --ca-bundle build/rds-ca-bundle.pem --upload "$ARTIFACT_BUCKET"
      - name: Jobs (slot materialiser and its daily schedule)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-jobs"
          --template infrastructure/jobs-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}" --param "CodeS3Bucket=$ARTIFACT_BUCKET"
          --param "SlotMaterialiserCodeS3Key=$(jq -r '.functions["slot-materialiser"]' build/manifest.json)"

  deploy-web:
    name: Deploy Web App (EC2)
    needs: deploy-jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/ci/aws_context.sh
      - name: Build and upload packages
        run: |
          mkdir -p build
          curl -sSfL -o build/rds-ca-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          python scripts/build_lambdas.py --env "$ENVIRONMENT" --ca-bundle build/rds-ca-bundle.pem --upload "$ARTIFACT_BUCKET"
      - name: REST API address (from the API stack's output)
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "medislot-${ENVIRONMENT}-api" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text 2>/dev/null || true)
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "::error::Stack medislot-${ENVIRONMENT}-api has no ApiUrl output; the web app needs the API address."
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Web app
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-dashboard"
          --template infrastructure/dashboard-stack.yaml --bucket "$ARTIFACT_BUCKET" --role-arn "$EXECUTION_ROLE"
          --param "Environment=${ENVIRONMENT}"
          --param "DashboardCodeS3Bucket=$ARTIFACT_BUCKET"
          --param "DashboardCodeS3Key=$(jq -r '.dashboard' build/manifest.json)"
          --param "ApiBaseUrl=$API_URL"
