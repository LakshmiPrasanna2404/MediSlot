name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: CloudFormation deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

# Only one deployment per environment at a time, so two quick pushes cannot
# run CloudFormation against the same stacks in parallel. A running deployment
# is never cancelled halfway; the next one waits for it to finish.
concurrency:
  group: medislot-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # 1. VALIDATE
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_REGION" ]] || { echo "::error::AWS_REGION is missing"; exit 1; }
          [[ -n "$AWS_ROLE_ARN" ]] || { echo "::error::AWS_ROLE_ARN is missing"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/api-stack.yaml \
            infrastructure/app-stack.yaml \
            infrastructure/monitoring-stack.yaml \
            infrastructure/dashboard-stack.yaml \
            lambda/auth/auth_handler.py \
            lambda/auth/requirements.txt \
            lambda/authorizer/authorizer_handler.py \
            lambda/app/app_handler.py \
            lambda/app/requirements.txt \
            dashboard/wsgi.py \
            dashboard/app.py \
            dashboard/requirements.txt
          do
            test -s "$file" || {
              echo "::error::Missing file: $file"
              exit 1
            }
          done

      - name: Lint templates
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, empty-lines: disable}}" \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/api-stack.yaml \
            infrastructure/app-stack.yaml \
            infrastructure/monitoring-stack.yaml \
            infrastructure/dashboard-stack.yaml

          cfn-lint --non-zero-exit-code error \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/api-stack.yaml \
            infrastructure/app-stack.yaml \
            infrastructure/monitoring-stack.yaml \
            infrastructure/dashboard-stack.yaml

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/api-stack.yaml \
            infrastructure/app-stack.yaml \
            infrastructure/monitoring-stack.yaml \
            infrastructure/dashboard-stack.yaml
          do
            echo "Validating $template"
            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION" >/dev/null
          done

  # 2. NETWORK
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    # Optional production approval gate (one approval covers the whole chain,
    # because every later job depends on this one).
    # To enable: create GitHub Environments named "dev" and "prod", add
    # required reviewers on "prod", then uncomment the line below.
    # NOTE: with a job-level environment, the GitHub OIDC "sub" claim becomes
    # repo:<owner>/<repo>:environment:<name>. The AWS role's trust policy must
    # allow that subject first, or the role assumption will fail.
    # environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve regional AWS-managed prefix lists
        id: prefix-lists
        shell: bash
        run: |
          set -euo pipefail

          S3_PREFIX_LIST_ID=$(aws ec2 describe-managed-prefix-lists \
            --filters "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.s3" \
            --region "$AWS_REGION" \
            --query 'PrefixLists[0].PrefixListId' \
            --output text)

          DYNAMODB_PREFIX_LIST_ID=$(aws ec2 describe-managed-prefix-lists \
            --filters "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.dynamodb" \
            --region "$AWS_REGION" \
            --query 'PrefixLists[0].PrefixListId' \
            --output text)

          [[ "$S3_PREFIX_LIST_ID" == pl-* ]] || {
            echo "::error::Could not find the regional S3 managed prefix list"
            exit 1
          }
          [[ "$DYNAMODB_PREFIX_LIST_ID" == pl-* ]] || {
            echo "::error::Could not find the regional DynamoDB managed prefix list"
            exit 1
          }

          echo "s3=$S3_PREFIX_LIST_ID" >> "$GITHUB_OUTPUT"
          echo "dynamodb=$DYNAMODB_PREFIX_LIST_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Network
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              S3PrefixListId="${{ steps.prefix-lists.outputs.s3 }}" \
              DynamoDBPrefixListId="${{ steps.prefix-lists.outputs.dynamodb }}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)

          echo "Network stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 3. DATA
  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)

          echo "Data stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 4. IAM
  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify IAM stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)

          echo "IAM stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 5. AUTHENTICATION AND JWT AUTHORIZER
  deploy-auth:
    name: Deploy Auth and Authorizer Lambdas
    runs-on: ubuntu-latest
    needs: deploy-iam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read deployment configuration
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue | [0]" \
            --output text)

          EXECUTION_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFormationExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          [[ -n "$BUCKET" && "$BUCKET" != "None" ]] || {
            echo "::error::ArtifactBucketName output missing"
            exit 1
          }

          [[ -n "$EXECUTION_ROLE" && "$EXECUTION_ROLE" != "None" ]] || {
            echo "::error::CloudFormationExecutionRoleArn output missing"
            exit 1
          }

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "execution_role=$EXECUTION_ROLE" >> "$GITHUB_OUTPUT"

      - name: Package Auth Lambda
        shell: bash
        run: |
          set -euo pipefail

          test -s lambda/auth/auth_handler.py
          test -s lambda/auth/requirements.txt

          rm -rf build/auth auth.zip
          mkdir -p build/auth

          python -m pip install \
            --only-binary=:all: \
            -r lambda/auth/requirements.txt \
            -t build/auth

          cp lambda/auth/auth_handler.py build/auth/

          (cd build/auth && zip -qr ../../auth.zip .)
          test -s auth.zip

      - name: Package Authorizer Lambda
        shell: bash
        run: |
          set -euo pipefail

          test -s lambda/authorizer/authorizer_handler.py

          rm -rf build/authorizer authorizer.zip
          mkdir -p build/authorizer

          cp lambda/authorizer/authorizer_handler.py build/authorizer/

          (cd build/authorizer && zip -qr ../../authorizer.zip .)
          test -s authorizer.zip

      - name: Upload Auth packages
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp auth.zip \
            "s3://${{ steps.deployment.outputs.bucket }}/medislot/${ENVIRONMENT}/auth/auth-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp authorizer.zip \
            "s3://${{ steps.deployment.outputs.bucket }}/medislot/${ENVIRONMENT}/auth/authorizer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Validate Auth template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/auth-stack.yaml \
            --region "$AWS_REGION" >/dev/null

      - name: Deploy Auth and Authorizer
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --template-file infrastructure/auth-stack.yaml \
            --role-arn "${{ steps.deployment.outputs.execution_role }}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AuthCodeS3Bucket="${{ steps.deployment.outputs.bucket }}" \
              AuthCodeS3Key="medislot/${ENVIRONMENT}/auth/auth-${GITHUB_SHA}.zip" \
              AuthorizerCodeS3Bucket="${{ steps.deployment.outputs.bucket }}" \
              AuthorizerCodeS3Key="medislot/${ENVIRONMENT}/auth/authorizer-${GITHUB_SHA}.zip" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Auth and Authorizer Lambdas
        shell: bash
        run: |
          set -euo pipefail

          for function in auth authorizer; do
            aws lambda get-function-configuration \
              --function-name "medislot-${ENVIRONMENT}-${function}" \
              --region "$AWS_REGION" \
              --query '{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
              --output table
          done

      - name: Verify Auth stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

  # 6. SHARED HTTP API AND AUTHENTICATION ROUTES
  deploy-api:
    name: Deploy Shared HTTP API
    runs-on: ubuntu-latest
    needs: deploy-auth

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read CloudFormation execution role
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFormationExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          [[ -n "$EXECUTION_ROLE" && "$EXECUTION_ROLE" != "None" ]] || {
            echo "::error::CloudFormationExecutionRoleArn output missing"
            exit 1
          }

          echo "execution_role=$EXECUTION_ROLE" >> "$GITHUB_OUTPUT"

      - name: Validate shared API template
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body file://infrastructure/api-stack.yaml \
            --region "$AWS_REGION" >/dev/null

      - name: Deploy shared API
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-api" \
            --template-file infrastructure/api-stack.yaml \
            --role-arn "${{ steps.deployment.outputs.execution_role }}" \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify shared API stack
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-api" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)

          echo "Shared API stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-api" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" \
            --output text)

          [[ -n "$API_URL" && "$API_URL" != "None" ]] || {
            echo "::error::ApiUrl output is missing"
            exit 1
          }
          echo "MediSlot shared API URL: $API_URL"

  # 7. DOCTOR AND PATIENT APP LAMBDA ROUTES
  deploy-app:
    name: Deploy App Lambda and Routes
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read deployment configuration
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue | [0]" \
            --output text)

          EXECUTION_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFormationExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          [[ -n "$BUCKET" && "$BUCKET" != "None" ]] || {
            echo "::error::ArtifactBucketName output missing"
            exit 1
          }

          [[ -n "$EXECUTION_ROLE" && "$EXECUTION_ROLE" != "None" ]] || {
            echo "::error::CloudFormationExecutionRoleArn output missing"
            exit 1
          }

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "execution_role=$EXECUTION_ROLE" >> "$GITHUB_OUTPUT"

      - name: Package App Lambda
        shell: bash
        run: |
          set -euo pipefail

          test -s lambda/app/app_handler.py
          test -s lambda/app/requirements.txt

          rm -rf build/app app.zip
          mkdir -p build/app

          python -m pip install \
            --only-binary=:all: \
            -r lambda/app/requirements.txt \
            -t build/app

          cp lambda/app/app_handler.py build/app/

          (cd build/app && zip -qr ../../app.zip .)
          test -s app.zip

      - name: Upload App Lambda package
        run: |
          aws s3 cp app.zip \
            "s3://${{ steps.deployment.outputs.bucket }}/medislot/${ENVIRONMENT}/app/app-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Deploy App Lambda and Routes
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --template-file infrastructure/app-stack.yaml \
            --role-arn "${{ steps.deployment.outputs.execution_role }}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AppCodeS3Bucket="${{ steps.deployment.outputs.bucket }}" \
              AppCodeS3Key="medislot/${ENVIRONMENT}/app/app-${GITHUB_SHA}.zip" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify App Lambda
        run: |
          aws lambda get-function-configuration \
            --function-name "medislot-${ENVIRONMENT}-app" \
            --region "$AWS_REGION" \
            --query '{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Verify API outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Verify App API URL
        shell: bash
        run: |
          set -euo pipefail

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='AppApiUrl'].OutputValue | [0]" \
            --output text)

          [[ -n "$API_URL" && "$API_URL" != "None" ]] || {
            echo "::error::AppApiUrl output is missing"
            exit 1
          }

          echo "MediSlot App API URL: $API_URL"

  # 8. MONITORING: ALARM TOPIC AND ALARMS
  deploy-monitoring:
    name: Deploy Monitoring and Alarms
    runs-on: ubuntu-latest
    needs: deploy-app

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read CloudFormation execution role
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFormationExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          [[ -n "$EXECUTION_ROLE" && "$EXECUTION_ROLE" != "None" ]] || {
            echo "::error::CloudFormationExecutionRole output missing"
            exit 1
          }

          echo "execution_role=$EXECUTION_ROLE" >> "$GITHUB_OUTPUT"

      - name: Deploy monitoring
        shell: bash
        env:
          # Optional repository variable. Empty means the topic has no subscriber.
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-monitoring" \
            --template-file infrastructure/monitoring-stack.yaml \
            --role-arn "${{ steps.deployment.outputs.execution_role }}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AlarmEmail="${ALARM_EMAIL:-}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify monitoring stack
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-monitoring" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)

          echo "Monitoring stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  # 9. OPERATIONS DASHBOARD (EC2)
  deploy-dashboard:
    name: Deploy Operations Dashboard
    runs-on: ubuntu-latest
    needs: deploy-monitoring

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check dashboard configuration
        shell: bash
        env:
          # Default is the admin's public IP. A DASHBOARD_ADMIN_CIDR repo variable overrides it.
          DASHBOARD_ADMIN_CIDR: ${{ vars.DASHBOARD_ADMIN_CIDR || '202.164.135.238/32' }}
        run: |
          set -euo pipefail

          [[ -n "${DASHBOARD_ADMIN_CIDR:-}" ]] || {
            echo "::error::Repository variable DASHBOARD_ADMIN_CIDR is missing. Set it to your public IP, for example 203.0.113.7/32."
            exit 1
          }

          # The dashboard must never be open to everyone.
          [[ "$DASHBOARD_ADMIN_CIDR" != "0.0.0.0/0" ]] || {
            echo "::error::DASHBOARD_ADMIN_CIDR must not be 0.0.0.0/0"
            exit 1
          }

          # The login needs these three SecureStrings before the page can work.
          for name in username password-hash session-secret; do
            aws ssm get-parameter \
              --name "/medislot/${ENVIRONMENT}/dashboard/${name}" \
              --region "$AWS_REGION" >/dev/null 2>&1 || {
              echo "::error::SSM parameter /medislot/${ENVIRONMENT}/dashboard/${name} is missing. See dashboard/README.md."
              exit 1
            }
          done

      - name: Read deployment configuration
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue | [0]" \
            --output text)

          EXECUTION_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFormationExecutionRoleArn'].OutputValue | [0]" \
            --output text)

          [[ -n "$BUCKET" && "$BUCKET" != "None" ]] || {
            echo "::error::ArtifactBucketName output missing"
            exit 1
          }

          [[ -n "$EXECUTION_ROLE" && "$EXECUTION_ROLE" != "None" ]] || {
            echo "::error::CloudFormationExecutionRoleArn output missing"
            exit 1
          }

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "execution_role=$EXECUTION_ROLE" >> "$GITHUB_OUTPUT"

      - name: Package dashboard
        shell: bash
        run: |
          set -euo pipefail

          test -s dashboard/wsgi.py
          test -s dashboard/requirements.txt

          rm -rf build/dashboard dashboard.zip
          mkdir -p build/dashboard
          cp -r dashboard build/dashboard/dashboard
          find build/dashboard -name '__pycache__' -type d -prune -exec rm -rf {} +

          (cd build/dashboard && zip -qr ../../dashboard.zip .)
          test -s dashboard.zip

      - name: Upload dashboard package
        run: |
          aws s3 cp dashboard.zip \
            "s3://${{ steps.deployment.outputs.bucket }}/medislot/${ENVIRONMENT}/dashboard/dashboard-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Deploy dashboard
        shell: bash
        env:
          # Default is the admin's public IP. A DASHBOARD_ADMIN_CIDR repo variable overrides it.
          DASHBOARD_ADMIN_CIDR: ${{ vars.DASHBOARD_ADMIN_CIDR || '202.164.135.238/32' }}
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-dashboard" \
            --template-file infrastructure/dashboard-stack.yaml \
            --role-arn "${{ steps.deployment.outputs.execution_role }}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AdminCidr="${DASHBOARD_ADMIN_CIDR}" \
              DashboardCodeS3Bucket="${{ steps.deployment.outputs.bucket }}" \
              DashboardCodeS3Key="medislot/${ENVIRONMENT}/dashboard/dashboard-${GITHUB_SHA}.zip" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify dashboard stack
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-dashboard" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)

          echo "Dashboard stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

          URL=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-dashboard" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue | [0]" \
            --output text)

          [[ -n "$URL" && "$URL" != "None" ]] || {
            echo "::error::DashboardUrl output is missing"
            exit 1
          }
          echo "MediSlot dashboard URL (reachable from DASHBOARD_ADMIN_CIDR only): $URL"
