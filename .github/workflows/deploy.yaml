
name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ARTIFACT_BUCKET: cloudmart-artifacts-393476285814

jobs:
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint PyYAML

      - name: Check required templates
        run: |
          set -euo pipefail
          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml
          do
            test -s "$template" || {
              echo "::error::Missing template: $template"
              exit 1
            }
          done

      - name: Lint templates
        run: |
          set -euo pipefail
          yamllint -d relaxed infrastructure/
          cfn-lint infrastructure/network-stack.yaml
          cfn-lint infrastructure/data-stack.yaml
          cfn-lint infrastructure/iam-stack.yaml --ignore-checks W3037
          cfn-lint infrastructure/auth-stack.yaml
          cfn-lint infrastructure/app-stack.yaml

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        run: |
          set -euo pipefail
          for template in \
            infrastructure/network-stack.yaml \
            infrastructure/data-stack.yaml \
            infrastructure/iam-stack.yaml \
            infrastructure/auth-stack.yaml \
            infrastructure/app-stack.yaml
          do
            echo "Validating $template"
            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"
          done

  deploy-network:
    name: Deploy Existing Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              EnableSSMEndpoint=true \
              EnableSNSEndpoint=false \
              EnableEventBridgeEndpoint=false \
              EnableStepFunctionsEndpoint=false \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

  deploy-data:
    name: Deploy Existing Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

  deploy-iam:
    name: Deploy Existing IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

  deploy-auth:
    name: Deploy Existing Auth Stack
    runs-on: ubuntu-latest
    needs: deploy-iam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install packaging and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint

      - name: Package Auth Lambda
        run: |
          set -euo pipefail
          test -f lambda/auth/auth_handler.py
          test -f lambda/auth/requirements.txt

          rm -rf build/auth
          mkdir -p build/auth

          python -m pip install \
            -r lambda/auth/requirements.txt \
            -t build/auth

          cp lambda/auth/auth_handler.py build/auth/

          (
            cd build/auth
            zip -qr ../../auth.zip .
          )

      - name: Package Authorizer Lambda
        run: |
          set -euo pipefail
          test -f lambda/authorizer/authorizer_handler.py

          rm -rf build/authorizer
          mkdir -p build/authorizer

          cp lambda/authorizer/authorizer_handler.py build/authorizer/

          (
            cd build/authorizer
            zip -qr ../../authorizer.zip .
          )

      - name: Upload Lambda packages
        run: |
          set -euo pipefail

          aws s3 cp auth.zip \
            "s3://${ARTIFACT_BUCKET}/medislot/${ENVIRONMENT}/auth/auth-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp authorizer.zip \
            "s3://${ARTIFACT_BUCKET}/medislot/${ENVIRONMENT}/auth/authorizer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Lint and validate Auth template
        run: |
          set -euo pipefail
          yamllint -d relaxed infrastructure/auth-stack.yaml
          cfn-lint infrastructure/auth-stack.yaml

          aws cloudformation validate-template \
            --template-body file://infrastructure/auth-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Auth
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --template-file infrastructure/auth-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              AuthCodeS3Bucket="${ARTIFACT_BUCKET}" \
              AuthCodeS3Key="medislot/${ENVIRONMENT}/auth/auth-${GITHUB_SHA}.zip" \
              AuthorizerCodeS3Bucket="${ARTIFACT_BUCKET}" \
              AuthorizerCodeS3Key="medislot/${ENVIRONMENT}/auth/authorizer-${GITHUB_SHA}.zip" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Auth stack
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Auth stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-app:
    name: Deploy Existing Application Stack
    runs-on: ubuntu-latest
    needs: deploy-auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint

      - name: Lint and validate Application template
        run: |
          set -euo pipefail
          yamllint -d relaxed infrastructure/app-stack.yaml
          cfn-lint infrastructure/app-stack.yaml

          aws cloudformation validate-template \
            --template-body file://infrastructure/app-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Application
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --template-file infrastructure/app-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Application
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-app" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Application stack status: $STATUS"
          [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" ]]
