
name: MediSlot CloudFormation CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  lint-and-validate:
    name: Lint and Validate Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow from main
        uses: actions/checkout@v4

      - name: Checkout Network Stack
        uses: actions/checkout@v4
        with:
          ref: feature/network-stack
          path: stack-sources/network

      - name: Checkout Data Stack
        uses: actions/checkout@v4
        with:
          ref: feature/data-stack
          path: stack-sources/data

      - name: Checkout IAM Stack
        uses: actions/checkout@v4
        with:
          ref: feature/iam-stack
          path: stack-sources/iam

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install cfn-lint yamllint PyYAML
          cfn-lint --version
          yamllint --version

      - name: Check required templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            stack-sources/network/infrastructure/network-stack.yaml \
            stack-sources/data/infrastructure/data-stack.yaml \
            stack-sources/iam/infrastructure/iam-stack.yaml
          do
            if [[ ! -s "$template" ]]; then
              echo "::error::Template missing or empty: $template"
              exit 1
            fi

            echo "Found: $template"
            wc -c "$template"
            sha256sum "$template"
          done

      - name: Lint YAML formatting
        shell: bash
        run: |
          set -euo pipefail

          yamllint -d relaxed \
            stack-sources/network/infrastructure/network-stack.yaml \
            stack-sources/data/infrastructure/data-stack.yaml \
            stack-sources/iam/infrastructure/iam-stack.yaml

      - name: Diagnose CloudFormation YAML parsing
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def construct_intrinsic(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              raise yaml.YAMLError(f"Unsupported intrinsic tag: !{tag_suffix}")

          CloudFormationLoader.add_multi_constructor(
              "!", construct_intrinsic
          )

          templates = [
              Path("stack-sources/network/infrastructure/network-stack.yaml"),
              Path("stack-sources/data/infrastructure/data-stack.yaml"),
              Path("stack-sources/iam/infrastructure/iam-stack.yaml"),
          ]

          errors = []

          for path in templates:
              print(f"\n=== Parsing {path} ===")

              try:
                  with path.open("r", encoding="utf-8-sig") as file:
                      document = yaml.load(
                          file, Loader=CloudFormationLoader
                      )

                  if not isinstance(document, dict):
                      raise ValueError(
                          f"Expected mapping, got {type(document).__name__}"
                      )

                  print("Top-level keys:", list(document.keys()))
                  print("Resources exists:", "Resources" in document)

                  if not isinstance(document.get("Resources"), dict):
                      raise ValueError(
                          "Resources must be a YAML mapping"
                      )

                  print("Resource count:", len(document["Resources"]))
                  print("YAML parsing passed.")

              except Exception as exc:
                  errors.append(f"{path}: {exc}")
                  print(f"ERROR: {path}: {exc}", file=sys.stderr)

          if errors:
              print("\nTemplate parsing failures:")
              for error in errors:
                  print(error)
              sys.exit(1)
          PY

      - name: Lint Network CloudFormation template
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="stack-sources/network/infrastructure/network-stack.yaml"
          echo "Linting Network: $TEMPLATE"
          cfn-lint "$TEMPLATE"

      - name: Lint Data CloudFormation template
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="stack-sources/data/infrastructure/data-stack.yaml"
          echo "Linting Data: $TEMPLATE"
          cfn-lint "$TEMPLATE"

      - name: Diagnose and Lint IAM CloudFormation template
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE="stack-sources/iam/infrastructure/iam-stack.yaml"

          echo "=== IAM template metadata ==="
          ls -l "$TEMPLATE"
          file "$TEMPLATE"
          wc -c "$TEMPLATE"
          sha256sum "$TEMPLATE"
          head -n 20 "$TEMPLATE"

          echo "=== cfn-lint version ==="
          cfn-lint --version

          echo "=== cfn-lint JSON diagnostics ==="
          cfn-lint --format json --ignore-checks W3037 "$TEMPLATE"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Validate CloudFormation templates with AWS
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            stack-sources/network/infrastructure/network-stack.yaml \
            stack-sources/data/infrastructure/data-stack.yaml \
            stack-sources/iam/infrastructure/iam-stack.yaml
          do
            echo "========================================"
            echo "AWS validating: $template"

            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region "$AWS_REGION"

            echo "AWS validation passed: $template"
          done

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Network Stack
        uses: actions/checkout@v4
        with:
          ref: feature/network-stack
          path: stack-source

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --template-file stack-source/infrastructure/network-stack.yaml \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
              EnableInterfaceEndpoints=false \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || \
             "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:
      - name: Checkout Data Stack
        uses: actions/checkout@v4
        with:
          ref: feature/data-stack
          path: stack-source

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --template-file stack-source/infrastructure/data-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-data" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || \
             "$STATUS" == "UPDATE_COMPLETE" ]]

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:
      - name: Checkout IAM Stack
        uses: actions/checkout@v4
        with:
          ref: feature/iam-stack
          path: stack-source

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::393476285814:role/medislot-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --template-file stack-source/infrastructure/iam-stack.yaml \
            --parameter-overrides Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify IAM
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-iam" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "IAM stack status: $STATUS"

          [[ "$STATUS" == "CREATE_COMPLETE" || \
             "$STATUS" == "UPDATE_COMPLETE" ]]
