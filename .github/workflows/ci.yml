name: CI

# Pull requests into main: lint -> unit tests -> integration tests, plus the
# secret and IaC scans. All four jobs are required status checks on main
# (scripts/github/protect_main.sh), so a red pipeline cannot be merged.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff, yamllint, cfn-lint
        run: bash scripts/ci/lint.sh

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, every commit in the pull request)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: IaC scan (checkov, blocking)
        run: |
          pip install checkov==3.2.459 cfn-flip==1.3.0
          bash scripts/ci/iac_scan.sh

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: medislot
          MYSQL_PASSWORD: medislot-test-pw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot-test-only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEDISLOT_TEST_DB_HOST: 127.0.0.1
      MEDISLOT_TEST_DB_USER: medislot
      MEDISLOT_TEST_DB_PASSWORD: medislot-test-pw
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Let the test user create test databases
        run: mysql -h 127.0.0.1 -uroot -proot-test-only -e "GRANT ALL PRIVILEGES ON *.* TO 'medislot'@'%'; FLUSH PRIVILEGES;"
      - name: pytest (real MySQL 8.4, AWS mocked with moto)
        run: python -m pytest tests/unit -q --junitxml=build/unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: build/unit-tests.xml

  integration:
    name: Integration tests
    needs: [unit, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run against the deployed dev environment
        env:
          MEDISLOT_ENV: dev
        run: python -m pytest tests/integration -q -m integration --junitxml=build/integration-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: build/integration-tests.xml
