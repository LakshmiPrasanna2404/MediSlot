name: Deploy

# Merge to main: lint -> unit tests -> package -> upload -> deploy through
# change sets -> migrate -> integration tests -> smoke test.
# Every stack update is a CloudFormation change set; the run log lists each
# change before it is executed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time; a running deployment is never cancelled halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  ENVIRONMENT: dev
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/ci/lint.sh

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install checkov==3.2.459 cfn-flip==1.3.0
          bash scripts/ci/iac_scan.sh

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: medislot
          MYSQL_PASSWORD: medislot-test-pw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot-test-only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEDISLOT_TEST_DB_HOST: 127.0.0.1
      MEDISLOT_TEST_DB_USER: medislot
      MEDISLOT_TEST_DB_PASSWORD: medislot-test-pw
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mysql -h 127.0.0.1 -uroot -proot-test-only -e "GRANT ALL PRIVILEGES ON *.* TO 'medislot'@'%'; FLUSH PRIVILEGES;"
      - run: python -m pytest tests/unit -q

  package:
    name: Package and upload
    needs: [lint, security, unit]
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.bootstrap.outputs.bucket }}
      role: ${{ steps.bootstrap.outputs.role }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read bootstrap outputs (artifacts bucket, CloudFormation execution role)
        id: bootstrap
        run: |
          set -euo pipefail
          read_output() {
            aws cloudformation describe-stacks --stack-name medislot-bootstrap \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          echo "bucket=$(read_output ArtifactsBucketName)" >> "$GITHUB_OUTPUT"
          echo "role=$(read_output CloudFormationExecutionRoleArn)" >> "$GITHUB_OUTPUT"
      - name: RDS certificate bundle (TLS to MySQL is verified against it)
        run: |
          mkdir -p build
          curl -sSfL -o build/rds-ca-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
      - name: Build and upload Lambda and web packages
        run: python scripts/build_lambdas.py --env "$ENVIRONMENT" --ca-bundle build/rds-ca-bundle.pem --upload "${{ steps.bootstrap.outputs.bucket }}"
      - run: python scripts/render_api_template.py
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-inputs
          path: |
            build/manifest.json
            build/templates/api-stack.yaml

  deploy:
    name: Deploy stacks (change sets)
    needs: package
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ needs.package.outputs.bucket }}
      ROLE: ${{ needs.package.outputs.role }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.126 cfn-flip==1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: deploy-inputs
          path: build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Preflight - seeded secrets exist
        run: |
          set -euo pipefail
          for name in auth/jwt-secret db/username db/password dashboard/session-secret; do
            aws ssm get-parameter --name "/medislot/${ENVIRONMENT}/${name}" --query Parameter.Name --output text >/dev/null \
              || { echo "::error::/medislot/${ENVIRONMENT}/${name} is missing. Run scripts/seed_secrets.sh ${ENVIRONMENT} (docs/runbook.md)."; exit 1; }
          done

      - name: Preflight - RDS engine version
        run: |
          VERSION=$(aws rds describe-db-instances --db-instance-identifier "medislot-${ENVIRONMENT}-mysql" \
            --query 'DBInstances[0].EngineVersion' --output text 2>/dev/null || echo none)
          echo "RDS MySQL engine: $VERSION"
          if [[ "$VERSION" == 8.0.* ]]; then
            echo "::warning::RDS MySQL 8.0 is past end of standard support (31 Jul 2026) and bills Extended Support. Upgrade to 8.4 (docs/runbook.md)."
          fi

      - name: Regional prefix lists
        id: prefix
        run: |
          set -euo pipefail
          for svc in s3 dynamodb; do
            id=$(aws ec2 describe-managed-prefix-lists --filters "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.${svc}" \
              --query 'PrefixLists[0].PrefixListId' --output text)
            [[ "$id" == pl-* ]] || { echo "::error::no ${svc} prefix list"; exit 1; }
            echo "${svc}=${id}" >> "$GITHUB_OUTPUT"
          done

      - name: Network
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-network" --template infrastructure/network-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"
          --param S3PrefixListId=${{ steps.prefix.outputs.s3 }}
          --param DynamoDBPrefixListId=${{ steps.prefix.outputs.dynamodb }}

      - name: Data (imports tables and buckets that were created by hand, once)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-data" --template infrastructure/data-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"
          --import RefreshTokensTable --import TokenRevocationsTable --import IdempotencyTable
          --import DoctorProfileFilesBucket

      - name: Config
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-config" --template infrastructure/config-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"

      - name: IAM
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-iam" --template infrastructure/iam-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"

      - name: Read package keys
        id: keys
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          manifest = json.load(open("build/manifest.json"))
          for name, key in manifest["functions"].items():
              print(f"{name}={key}")
          print(f"dashboard={manifest['dashboard']}")
          EOF

      - name: Auth
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-auth" --template infrastructure/auth-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"
          --param "AuthCodeS3Bucket=$BUCKET" --param AuthCodeS3Key=${{ steps.keys.outputs.auth }}
          --param "AuthorizerCodeS3Bucket=$BUCKET" --param AuthorizerCodeS3Key=${{ steps.keys.outputs.authorizer }}

      - name: App (doctor and patient Lambdas)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-app" --template infrastructure/app-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}" --param "CodeS3Bucket=$BUCKET"
          --param DoctorProfileCodeS3Key=${{ steps.keys.outputs.doctor-profile }}
          --param PhotoUploadCodeS3Key=${{ steps.keys.outputs.photo-upload }}
          --param ConsultationTypesCodeS3Key=${{ steps.keys.outputs.consultation-types }}
          --param AvailabilityCodeS3Key=${{ steps.keys.outputs.availability }}
          --param ScheduleCodeS3Key=${{ steps.keys.outputs.schedule }}
          --param PatientProfileCodeS3Key=${{ steps.keys.outputs.patient-profile }}
          --param DoctorSearchCodeS3Key=${{ steps.keys.outputs.doctor-search }}
          --param SlotLookupCodeS3Key=${{ steps.keys.outputs.slot-lookup }}
          --param DbMigrateCodeS3Key=${{ steps.keys.outputs.db-migrate }}

      - name: Jobs (slot materialiser and its daily schedule)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-jobs" --template infrastructure/jobs-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}" --param "CodeS3Bucket=$BUCKET"
          --param SlotMaterialiserCodeS3Key=${{ steps.keys.outputs.slot-materialiser }}

      - name: Monitoring
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-monitoring" --template infrastructure/monitoring-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}" --param "AlarmEmail=${{ vars.ALARM_EMAIL }}"

      - name: Web app (EC2)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-dashboard" --template infrastructure/dashboard-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"
          --param "DashboardCodeS3Bucket=$BUCKET" --param DashboardCodeS3Key=${{ steps.keys.outputs.dashboard }}

      - name: API (REST API, authorizer, routes)
        run: >-
          python scripts/cfn_deploy.py --stack "medislot-${ENVIRONMENT}-api" --template build/templates/api-stack.yaml
          --role-arn "$ROLE" --bucket "$BUCKET" --tag "Environment=${ENVIRONMENT}"
          --param "Environment=${ENVIRONMENT}"

  migrate:
    name: Database migrations
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # "check" proves a Lambda in the private subnets reaches RDS; "migrate"
      # applies pending versions from database/migrations.
      - name: Connectivity check, then pending migrations
        shell: bash
        run: |
          set -euo pipefail
          for action in check migrate; do
            aws lambda invoke --function-name "medislot-${ENVIRONMENT}-db-migrate" \
              --cli-binary-format raw-in-base64-out --payload "{\"action\":\"${action}\"}" \
              --cli-read-timeout 180 out.json > meta.json
            cat out.json; echo
            if grep -q FunctionError meta.json; then echo "::error::db-migrate ${action} failed"; exit 1; fi
          done

  integration:
    name: Integration tests
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run against the deployed environment
        env:
          MEDISLOT_ENV: ${{ env.ENVIRONMENT }}
          MEDISLOT_READ_JWT_SECRET: 'true'
        run: python -m pytest tests/integration -q -m integration

  smoke:
    name: Smoke test
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: API and web app answer
        shell: bash
        run: |
          set -euo pipefail
          output() { aws cloudformation describe-stacks --stack-name "$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" --output text; }
          API=$(output "medislot-${ENVIRONMENT}-api" ApiUrl)
          WEB=$(output "medislot-${ENVIRONMENT}-dashboard" DashboardUrl)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/auth/patients/login" -H 'Content-Type: application/json' \
                 -d '{"email":"smoke@example.invalid","password":"not-a-real-password1"}')
          [[ "$code" == 401 ]] || { echo "::error::login with bad credentials returned $code, expected 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/doctors")
          [[ "$code" == 401 ]] || { echo "::error::GET /doctors without a token returned $code, expected 401"; exit 1; }
          for attempt in $(seq 1 30); do
            if curl -sf "$WEB/" | grep -q "Login as Doctor"; then echo "Web app up at $WEB"; break; fi
            [[ $attempt == 30 ]] && { echo "::error::web app not answering at $WEB"; exit 1; }
            sleep 10
          done
          echo "API: $API"
          echo "Web: $WEB"
